name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # 手动触发。首推创建默认分支时 GitHub 不一定评估同一次推送里新增的工作流，
  # 这条就是那之后想重跑门禁的入口。
  workflow_dispatch:

permissions:
  contents: read

# 这个项目**只能**在 Windows 上构建与验证：
# `crates/capture` 走 Windows Graphics Capture + Windows.Media.Ocr，
# `ui/src-tauri` 的 bundle target 只有 msi / nsis。
# 所以 runner 不是 ubuntu——换 Linux 只会得到一个必然红、且红了也不能信的 CI。
env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  # ⚠⚠ **2026-10-18：这一行之前没有，于是 CI 连红 28 次。**
  #
  # `tauri.conf.json` 的 `bundle.resources` 指向 `../../target/models/ppocrv6-small/*`，
  # 而 `target/` 是 gitignored 的，**干净 runner 上那个目录不存在**。tauri-build
  # 的 build script 在 `cargo check/clippy/test` 时就会遍历 resources，
  # glob 匹配为空**无条件**抛 `GlobPathNotFound`（tauri-utils `resources.rs:289`）
  # ⇒ 每个 cargo 步骤全挂。实测：最后一次绿是 `acf3d0f`，
  # 从 `ab8831d`（加 resources 那次）起再没绿过。
  #
  # 这里为什么是 `null` 而不是 `{}`：TAURI_CONFIG 走 `json_patch::merge`
  # （tauri-build `lib.rs:684`，即 RFC 7396 merge patch），
  # **空对象是空操作**——写 `{"bundle":{"resources":{}}}` 什么都不会删。
  # 必须给 `null` 才真的删掉那个键，删掉后
  # `config.bundle.resources` 是 `None`，tauri-build `lib.rs:745-749`
  # 的 `unwrap_or(List(vec![]))` 就不会去迭代 glob。
  #
  # 为什么 CI 可以不打包：CI 只跑 clippy/test/lint，从不跑 `tauri build`，
  # 所以那个 resources 映射在这里本来就不会被用到。
  # **发版那条路要权重**，`release.yml` 里另有 `fetch_models.py` 去取——
  # ⚠ 而那条路目前是坏的，见 `.scratch/…/51-release-cannot-fetch-dict.md`。
  TAURI_CONFIG: '{"bundle":{"resources":null}}'

jobs:
  gate:
    name: Gate
    runs-on: windows-latest
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@v6

      - name: Setup | Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup | Node + pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Setup | Install frontend deps
        working-directory: ui
        run: pnpm install --frozen-lockfile

      # ⚠⚠ **2026-10-18 订正**：原文写「下面九步与 `scripts/gate.ps1` 一一对应」，
      # 而**实际不是**——两处硬伤：
      # ① **`sheet pack in sync` 这一步 CI 里根本没有**（本地每次都跑）。
      #    它是 `ui/scripts/sheetpack.ps1 -Check`，纯 pwsh 脚本，CI 完全能跑。
      #    ⇒ 一份改了 SVG 内嵌 base64 的 PR，**本地门禁红、CI 绿**。
      # ② **`prettier + eslint` 与 `svelte-autofixer` 两个都编号 `8/9`**
      #    ——所以「九步」这个总数从一开始就是假的。
      #
      # **现在刻意不写 `/总数`**，只留 `Gate N` 这个位置号。分母是这里唯一会
      # 反复变假的东西：`secret scan` 在本地 `gate.ps1` 里没设
      # `CHATSERVANT_PROBE_KEY` 就跳过，CI 用占位 key 必跑 ⇒ 两侧总数天生不等；
      # 而每次往这张表加一步，任何写死的分母立刻过期，还长得像"已对齐"。
      # ⇒ 「对齐」指的是**步的集合一致**，不是数字相同。
      # 通篇的「九步」是 CONTRIBUTING 那张表的计数（它把 lint+autofixer 并成一步、
      # 不含 mojibake / sheetpack 两个便宜的），见 `docs/HANDOFF.md` §5。

      # ① 编码损坏（U+FFFD）。它排在最前面，因为它最便宜——
      #    受损的全是注释与文档，fmt / clippy / test / svelte-check 一律照绿。
      - name: "Gate 1 | mojibake scan"
        shell: pwsh
        run: ./scripts/scan-mojibake.ps1

      # ② 贴纸包（探针面板那张撕边纸）内嵌的 base64 与源图是否逐字节相同。
      - name: "Gate 2 | sheet pack in sync"
        shell: pwsh
        run: ./ui/scripts/sheetpack.ps1 -Check

      # 本门禁自己的组成有没有漂到 CI 外面去。名单从 scripts/gate.ps1 反推，
      # 见证取命令而非步名（本地 `ui build` / CI `vite build` 名字本就故意不同）。
      # 2026-10-18 第一次去核就抓到 `sheet pack in sync` 本地跑、CI 里没有。
      - name: "Gate 3 | gate/CI parity"
        shell: pwsh
        run: ./scripts/check-gate-parity.ps1

      # ④ 版本号在四个文件里各声明一份（JSON 那两处没有继承可借），
      # 而发版闸只比 tag ↔ tauri.conf.json，另外三处对不上它**不会拦**。
      # 纯读文件，所以排在编译那几步前面。
      - name: "Gate 4 | version consistency"
        shell: pwsh
        run: ./scripts/check-version.ps1

      # license 在**每个**工作区成员里各声明一份，唯一出处是根 `[workspace.package]`。
      # 成员清单由 `cargo metadata --no-deps` 给（不是硬编码包名）⇒ 新增 crate 自动被覆盖。
      #
      # ⚠ 这一步**不能**指望 `cargo deny check` 顺带抓。MIT / Apache-2.0 都在
      #   deny.toml 的白名单里，所以写错成 MIT 不会触发 "not explicitly allowed"；
      #   `deny.toml` 里那条 BUSL-1.1 例外变成用不上的，cargo-deny 只发一条
      #   `warning[license-exception-not-encountered]` 并**仍然 exit 0**
      #   （2026-10-18 实测：改回去 deny_exit=0）。
      #   ⇒ 在这个方向上 cargo deny 是瞎的，这道是唯一能守住它的东西。
      - name: "Gate 5 | license consistency"
        shell: pwsh
        run: ./scripts/check-license.ps1

      # ⚠ 底色不透明度。`app.css` 顶头那条硬约束：Tauri 透明窗口走
      #   WebView2 分层合成，子元素上的半透明底色**整层不绘制**。
      #   而**浏览器里查不出来**——`?demo=1` 的出图评审、svelte-check、
      #   `pnpm build` 全在 Chromium 里跑，那里半透明底色画得好好的。
      #   ⇒ 这类错只有真机 Tauri 窗口能看见，CI 上也没有那个窗口，
      #      只能靠这道纯文本扫描守（2026-10-18 实测扫到 7 处并全部修掉）。
      - name: "Gate 5b | opaque backgrounds"
        shell: pwsh
        run: ./scripts/check-opaque-bg.ps1

      # ⚠ 取证闸（`.githooks/pre-commit`）自身。
      #
      # 凭据闸是硬约束第 7 条的最后一道防线，而它自己**没有任何守卫**——
      # 2026-10-18 实测 `grep -n 'githooks' scripts/gate.ps1` 零命中。
      # 它整个消失或判据被改坏，门禁一声不吭。
      #
      # ⚠ 它在 CI 上尤其该跑：githooks 只在本机生效（CONTRIBUTING 陷阱 5），
      #   所以这一道是**唯一**能让「闸门被改坏」在 PR 上就响的地方。
      #   守卫查三样：判据片段还在、marker 仍是两段式（没自豁免）、
      #   图片白名单与仓库实际跟踪的图片一致（当前 7 张）。
      - name: "Gate 5c | forensics hook guard"
        shell: pwsh
        run: ./scripts/check-hooks.ps1

      - name: "Gate 6 | cargo fmt --check"
        run: cargo fmt --all --check

      - name: "Gate 7 | cargo clippy -D warnings"
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: "Gate 8 | cargo test"
        run: cargo test --workspace

      # ⑤ 凭据扫描。
      #
      # ## 这里能证明什么、不能证明什么
      #
      # CI 上**没有真 key 可查**，所以这一步证明的是两件事：
      #   · 扫描器在 CI 环境里确实跑得起来（不是"没输出 = 干净"）；
      #   · 扫描器**抓得到**——先埋探针要求它报警，撤掉后要求它闭嘴。
      # 只跑一遍"没报警"是不够的：扫描器坏了和仓库干净，在屏幕上长得一模一样。
      #
      # 真正有意义的 key 排查在本机跑（`gate.ps1` 里用真实机器 key 那次）。
      #
      # ## 探针 key 必须运行时生成
      #
      # 曾经这里写的是字面量 `CHATSERVANT_PROBE_KEY: sk-...`，于是那串字面量
      # **本身就在 ci.yml 里**，扫描器如实报出了 ci.yml——扫描器没坏，是探针自指了。
      # 探针串一旦入库，它要找的东西就住在他自己家里。
      - name: "Gate 9 | secret scan"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bytes = [Security.Cryptography.RandomNumberGenerator]::GetBytes(24)
          $env:CHATSERVANT_PROBE_KEY = 'sk-' + [Convert]::ToHexString($bytes).ToLower()

          $canary = 'target/probe/canary-secret.txt'
          New-Item -ItemType Directory -Force -Path (Split-Path $canary) | Out-Null

          Write-Output '① 埋探针，扫描器**应当**报警'
          Set-Content -LiteralPath $canary -Value $env:CHATSERVANT_PROBE_KEY
          cargo run -q -p xtask -- secret-scan
          if ($LASTEXITCODE -eq 0) {
            throw '扫描器没抓到刚埋进去的探针 —— 它的"没抓到"不可信'
          }

          Write-Output '② 撤掉探针，扫描器**应当**干净'
          Remove-Item -LiteralPath $canary -Force
          cargo run -q -p xtask -- secret-scan
          if ($LASTEXITCODE -ne 0) {
            throw "撤掉探针后仍然报警（exit=$LASTEXITCODE）"
          }

          Write-Output 'SECRET_SCAN_OK —— 抓得到探针，也放得过干净仓库'

      # ⑥ 许可证 / advisory / 来源合规，策略见 docs/adr/0003-dependency-strategy.md
      - name: "Gate 10 | cargo deny check"
        run: cargo install cargo-deny --locked && cargo deny check

      - name: "Gate 11 | svelte-check"
        working-directory: ui
        run: pnpm check

      - name: "Gate 12 | prettier + eslint"
        working-directory: ui
        run: pnpm lint

      - name: "Gate 13 | svelte-autofixer"
        shell: pwsh
        run: ./ui/scripts/autofixer.ps1

      - name: "Gate 14 | vite build"
        working-directory: ui
        run: pnpm build

      # 黄金测试的夹具来自真实会话，不入公开仓库，没有夹具时它们**跳过**。
      # 这里显式记一句，免得 CI 绿灯被读成「像素级基线验过了」。
      - name: Note | golden fixtures are absent by design
        run: |
          Write-Output "::notice::crates/capture/fixtures 不在仓库里（真实会话脱敏帧）。"
          Write-Output "::notice::依赖它的 golden 测试在本次 CI 里是【跳过】，不是通过。"
