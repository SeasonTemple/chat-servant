name: Release

# 由 tag 触发，不自动发版。版本号是**人打的 tag**，不是从 commit 算出来的——
# 这个项目 0.x 且还在改硬约束，「这一版该叫什么」不是机器能替人做的决定。
on:
  push:
    tags: ["v*"]
  # 手动重跑：某个 tag 的构建挂了、或者想把同一个 tag 的安装包重新出一次。
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（必须已存在于远端；dry_run 时可以填 main 之类任意 ref）"
        required: true
        type: string
      dry_run:
        description: "只跑到「装包内有权重」为止，**不发布任何东西**。用来在没有 tag 的情况下验证整条发版链路。"
        required: false
        default: false
        type: boolean
      draft:
        description: "把 release 建为**草稿**：资产照样上传、整条 publish 路径照跑，但不进 Releases 页、不通知任何人。验收过了在 UI 上一键 Publish 即可。"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  # 门：发布前再跑一遍完整门禁，红则不发。
  verify:
    runs-on: windows-latest
    # ⚠⚠ **同一个缺陷的第二个现场**（2026-10-18 dry run 39036210343 当场抓到）。
    #
    # 这一步跑 cargo 时**权重还没取**（取权重在 build job 里，晚得多），
    # 而 tauri-build 的 build script 在每个 cargo 步骤都会遍历 `bundle.resources`，
    # glob 匹配为空**无条件**抛 `GlobPathNotFound` ⇒ verify 必红，
    # 于是 `build` job 被 needs 连坐跳过，**发版链路一步都走不到**。
    #
    # 我先前只在 ci.yml 上修了同一个问题，于是它在隔壁文件原样复发。
    # verify 不打包，所以处理方式与 CI 相同：把映射 null 掉。
    # 细节与「为什么必须是 null 而不是 {}」见 ci.yml 里的长注释。
    env:
      TAURI_CONFIG: '{"bundle":{"resources":null}}'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install frontend deps
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: mojibake scan
        shell: pwsh
        run: ./scripts/scan-mojibake.ps1
      - name: fmt + clippy + test
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

  build:
    name: Build installers
    runs-on: windows-latest
    needs: verify
    # ⚠ `concurrency.group` **不能用 env 上下文**——GitHub 只允许
    #   github / inputs / vars / needs / strategy / matrix。
    #   写成 `${{ env.RELEASE_TAG }}` 会让整个工作流校验失败，症状很隐蔽：
    #   Actions 里它仍显示 state=active，但**名字退化成文件路径**，
    #   而且每次 push 都会产生一个「零 job、conclusion=failure」的运行，
    #   连 `on: push: tags` 这类过滤都不再生效。
    #   症状与根因隔了三层，所以这里把表达式直接展开写，不复用 env。
    concurrency:
      group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      # tag 推送时用 ref_name；手动重跑时用输入框的值。
      # 两者不能混用——dispatch 的 ref_name 是分支名（"main"），
      # 拿它当 tag 会去发布一个叫 main 的 release，checkout 也会检出分支而不是 tag。
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      # 装包产物目录。
      #
      # ⚠⚠ **不是** `ui/src-tauri/target/release/bundle`——本文件原先三处都写的
      #   那个路径，**三处都错**（核对装包、publish 资产、dry run 收尾）。
      #   `ui/src-tauri` 是**根工作区的成员**，所以 cargo 的 target 目录在工作区根。
      #   本机实测：`target/release/bundle/msi/chat-servant_0.1.0_x64_en-US.msi`、
      #   `.../nsis/chat-servant_0.1.0_x64-setup.exe` 都在那儿，
      #   而 `ui/src-tauri/target` **根本不存在**。
      #   ⇒ 「核对装包内有权重」会 throw「没找到打包产物目录」，
      #     publish 的资产 glob 会拿到空再 throw——即使 `tauri build` 成功。
      #
      #   抽成 env 就是为了让这个路径**只存在一处**：三份副本里的任何一份
      #   漂了，两份还对的读者不会察觉（这与本仓那句「三处文档都说对应
      #   并不让那句话更真一点」是同一个陷阱）。
      BUNDLE_DIR: target/release/bundle
    steps:
      # ⚠⚠ **发版链路最后一跳至今没被任何 runner 执行过**（2026-10-18）。
      #
      # 上面每一步（verify / 取权重 / 打包 / 核对装包）都在真 runner 上跑通了，
      # 只有 `gh release create` 这一发没有——而它排在**最后**：
      # 前面的构建要烧二三十分钟，它一失败就全白费。
      # `gh release create` **没有 --dry-run**，所以这一跳在任何授权下都无法
      # 零风险预演（已查 `gh release create --help`：无此开关）。
      #
      # 于是改成**让它自证**：在装工具链、装依赖、打包**之前**，
      # 把这一跳的判据原样打出来，并做一条版本一致性检查。
      # 这一步只读文件、只 echo，**不发任何东西、不改任何东西**。
      #
      # ⚠ 判据那两行表达式与下面 publish 步的 `if:` **逐字相同**——
      #   所以这里打出来的 `publish_would_run` 就是那一步会不会跑，
      #   而不是另一套独立算出来的值（两套算式迟早会漂，而漂了没人看得出来）。
      #
      # 位置在 checkout 之后、toolchain/pnpm/build 之前：
      #   要读 `tauri.conf.json` 就必须已检出（checkout 只要十几秒，
      #   而报错晚一分钟总比晚三十分钟好）。
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Report publish gate
        shell: pwsh
        # ⚠ `PUBLISH_WOULD_RUN` 用的是与下面 publish 步 `if:` **逐字相同**的表达式。
        #   这样整个文件里控制「发不发」的表达式**只有一个**，
        #   而不是我在这里另写一份算式——两套算式迟早会漂，漂了没人看得出来。
        #   （发布说明里也直接打这个值，所以日志打出来的就是那一步的真判据。）
        env:
          PUBLISH_WOULD_RUN: ${{ !inputs.dry_run }}
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Output '=== PUBLISH GATE ==='
          Write-Output "  event_name        = ${{ github.event_name }}"
          Write-Output "  resolved_tag      = $env:RELEASE_TAG"
          Write-Output "  inputs.dry_run    = [${{ inputs.dry_run }}]"
          Write-Output "  publish_would_run = $env:PUBLISH_WOULD_RUN"
          Write-Output "  assets_from       = $env:BUNDLE_DIR"

          # ⚠ 字符串当布尔用是 PowerShell 的经典坑：`'false'` 是**非空字符串**
          #   ⇒ 判为真。`${{ !inputs.dry_run }}` 在 dispatch 且 dry_run=false 时
          #   渲染出来的**正是字符串 `'false'`**，而那恰恰是要发布的那一档。
          #   所以这里反向取：只有**明确**是 false/0 才算 dry run，
          #   其余（含空串、大小写变体、意外值）一律按「要发布」处理。
          #   方向不能反——反了就会在真发布时跳过版本检查，
          #   而那正是这道闸要拦的那种错标 release。
          $isPublish = ($env:PUBLISH_WOULD_RUN -notmatch '^\s*(?i:false|0)\s*$')

          # ⚠⚠ **tag 与安装包里的版本号是两套东西**，而 `tauri build` 的产物名
          #   用的是后者（`chat-servant_<version>_x64-setup.exe`）。
          #   tag 打到 v0.1.1 而 `tauri.conf.json` 还写 0.1.0 时，
          #   发出去的 release 标题是 v0.1.1、附件却叫 chat-servant_0.1.0_...。
          #   下载的人拿到的是「0.1.0 的文件，挂在 1.1 的发布页下面」，
          #   而**没有任何一步会报错**——它俩根本不在一个空间里核对。
          #
          #   收紧方向是「不发版」而不是「发一个错标的版」，所以这条是安全的。
          #
          # ⚠⚠ **只在真要发布时才拦**。dry run 传的 tag 是 `main`（还没有 tag），
          #   `main` 的版本号当然对不上——第一版没加这个条件，
          #   结果这道闸把 dry run 入口**自己堵死了**，是自证用例 C 抓出来的。
          #   两值照样打印，只是 dry run 时不判死。
          $cfg = Get-Content ui/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $tagVer = $env:RELEASE_TAG -replace '^v', ''
          Write-Output "  tauri_version     = $($cfg.version)"
          Write-Output "  tag_version       = $tagVer"
          if ($cfg.version -ne $tagVer) {
            if (-not $isPublish) {
              Write-Warning '版本号对不上，但本次是 dry run（不发布），继续跑完整条链路。'
            }
            else {
              Write-Error ("tag '$env:RELEASE_TAG' 与 tauri.conf.json 的 version '$($cfg.version)' 不一致。" +
                ' 附件名用的是后者，先改版本号再打 tag —— 否则会发出一个标题与文件名对不上的 release。')
              exit 1
            }
          }

      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install frontend deps
        working-directory: ui
        run: pnpm install --frozen-lockfile

      # ⚠ 必须在 `tauri build` **之前**：`bundle.resources` 指的是
      # `../../target/models/ppocrv6-small/*`，那些文件要真的在磁盘上，
      # 否则 Tauri 直接报「资源不存在」而打包失败。
      #
      # 权重**不进仓库**（30MB 二进制 + 模型许可，见 ADR-0003），
      # 所以每次发版都得现取。`scripts/fetch_models.py` 逐个核对 SHA256，
      # 对不上就报错退出——宁可发版失败，也不要装出去一个来路不明的权重。
      #
      # ⚠⚠ **2026-10-18 订正：原先这里写的是 `uv run --with rapidocr --with
      # omegaconf python ...`，而 `windows-latest` 上并没有 uv。**
      # 依据是官方 runner 镜像清单（`actions/runner-images`
      # `images/windows/Windows2025-Readme.md`，image `20261013.288.2`）：
      # Tools 与 Package Management 两段共列了 60 多个工具（含 pip 26.2.1 /
      # Pipx / Chocolatey / Miniconda），**没有 uv**。Linux 镜像有，Windows 没有。
      #
      # 这条之所以一直没被发现：`release.yml` 历史上**只跑过一次，结论是
      # cancelled，从未成功过**——「配置里写了 uv」只是纸面断言，不是它能跑通的证据。
      # 改用 `actions/setup-python` + `pip`：两者都是 first-party / 镜像清单里确有的。
      - name: Setup | Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install OCR model-table dependencies
        run: python -m pip install --disable-pip-version-check rapidocr omegaconf

      - name: Fetch PP-OCR weights
        run: python scripts/fetch_models.py

      - name: Verify weights before bundling
        run: python scripts/fetch_models.py --check

      # 这个项目**只发 Windows 安装包**：捕获链路走 WGC + Windows.Media.Ocr，
      # 没有等价实现，所以不做跨平台矩阵。
      - name: Build msi + nsis
        working-directory: ui
        run: pnpm tauri build --bundles msi,nsis

      # ⚠ 打包完**当场核对装包里真的有权重**。
      # 「配置里写了 resources」不等于「文件真的进去了」——
      # 路径写错时 Tauri 未必报错，而产品侧的表现是
      # 「装上了，但 OCR 一直是慢的那条路」。
      #
      # ⚠⚠ **这里原先内联的那段查错了地方**（2026-10-18 dry run `39038993181` 红）：
      #   `Get-ChildItem $BundleDir -Recurse -Include '*.onnx'` 找的是**打包目录里
      #   的散文件**，而 `bundle.resources` 的内容进的是**安装包内部**
      #   （`<安装目录>\models\ppocrv6-small\`）。两者不是一个空间 ⇒ 必然找不到。
      #   而权重其实好好地在装包里（NSIS 的 `7z l` 直接列得出三个文件）。
      #
      # 现在调 `scripts/verify_bundle.ps1`：它**翻安装包内部**，而且把查法与理由
      # 都打在日志里（NSIS 按路径、MSI 按体积——MSI 内部流名是哈希）。
      # 本地拿真装包验过：MSI 抽出的流是 21,234,383 / 9,929,594 / 74,947 字节，
      # 与三个权重文件逐字节等长。
      - name: Verify weights landed in the bundle
        shell: pwsh
        run: ./scripts/verify_bundle.ps1

      # 发布说明是**人工策展**的，不是自动生成的：每个 tag 都要有一份
      # docs/release-notes/vX.Y.Z.md，里面同时有 `## 中文` 和 `## English`。
      # 有就用它覆盖自动生成的 notes；没有就保留自动生成的，并**明确告诉人**——
      # 静默留下自动 notes 会让人以为策展已经做过了。
      #
      # ⚠ `dry_run` 是唯一能**不出东西**就跑完整条链路的入口：
      #   取权重 → tauri build → 核对装包内有权重 全部照跑，只跳过这一发。
      #   `inputs.dry_run` 在 push 触发时为空 ⇒ `!inputs.dry_run` 为真 ⇒ 照常发。
      - name: Publish | GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
          # ⚠ 这里的**极性是反的**，且必须反。
          #   上面版本闸那条是「未知 ⇒ 按要发布处理」（于是去拦版本），
          #   这条是「未知 ⇒ 按草稿处理」（于是不发布）。
          #   两条的共同原则是同一个：**判不出来时，按「不做不可逆的事」处理。**
          #   本条判错的后果是「本该是草稿的东西被公开了」——那不可逆；
          #   反向判错只是「多建一个草稿」，UI 上一键就能收。
          MAKE_DRAFT: ${{ inputs.draft }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $note = "docs/release-notes/$env:TAG.md"
          $assets = Get-ChildItem -Path $env:BUNDLE_DIR -Recurse -Include *.msi,*.exe -File

          if (-not $assets) {
            throw "没有找到安装包产物，bundle 目录可能是空的"
          }

          if (Test-Path $note) {
            $body = Get-Content $note -Raw
            if ($body -notmatch '(?m)^##\s*中文' -or $body -notmatch '(?m)^##\s*English') {
              throw "$note 缺少 '## 中文' 或 '## English' 段 —— 双语发布说明是门禁，不是建议"
            }
          }
          else {
            Write-Warning "没有 $note，沿用 GitHub 自动生成的 release notes"
            $body = ""
          }

          # ⚠ 不能用 $args —— 它是 PowerShell 的自动变量，赋值会与脚本参数
          #   语义打架（PowerShell 7 起会直接报错）。随便起个名字即可。
          # 没有策展说明时**不要**传 --notes：传空串会得到一个空正文的 release，
          # 而 gh 只在**完全不给** --notes/--notes-file 时才自动生成 notes。
          # 这两者的差别就是「保留自动 notes」和「发一条空白 release」的差别。
          $ghArgs = @('release', 'create', $env:TAG, '--title', $env:TAG, '--verify-tag')

          # ⚠ 只有**明确**是 false/0 才算「要公开发布」。
          #   `'false'` 在 PowerShell 里是非空字符串、判为真，
          #   而 `inputs.draft=false` 渲染出来**正是字符串 'false'**——
          #   按真值判会把「明确要发布」当成草稿。
          $isDraft = ($env:MAKE_DRAFT -notmatch '^\s*(?i:false|0)\s*$')
          if ($isDraft) {
            $ghArgs += '--draft'
            Write-Warning '本次是**草稿**：资产会上传、整条 publish 路径照跑，但不进 Releases 页、不通知任何人。'
          }

          if ($body) {
            $ghArgs += @('--notes', $body)
          }
          else {
            Write-Warning "沿用 gh 自动生成的 release notes"
          }
          foreach ($a in $assets) { $ghArgs += @($a.FullName) }
          & gh @ghArgs
          if ($LASTEXITCODE -ne 0) { throw "gh release create 失败 (exit=$LASTEXITCODE)" }

          if ($isDraft) {
            Write-Output "已为 $($env:TAG) 建立**草稿 release**，资产 $($assets.Count) 个。"
            Write-Output "⚠ 它还**没有**公开：在 Releases 页点一下 Publish 才会对外可见。"
          }
          else {
            Write-Output "已发布 $($env:TAG)，资产 $($assets.Count) 个"
          }

      # dry run 的落点。**必须显式出声**，否则「跑完了」会被读成「发出去了」——
      # 而这次跑动的产物确实存在（在 runner 上），只是没有离开 runner。
      - name: Dry run | nothing was published
        if: ${{ inputs.dry_run }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = Get-ChildItem $env:BUNDLE_DIR -Recurse -Include *.msi,*.exe -File -ErrorAction SilentlyContinue
          Write-Output '=================================================='
          Write-Output 'DRY RUN —— **没有创建 release、没有上传任何资产、没有打 tag**'
          Write-Output "构建产物（只存在于 runner 上，任务结束即丢弃）：$($assets.Count) 个"
          $assets | ForEach-Object { Write-Output "  $($_.Name)  $([math]::Round($_.Length/1MB,1)) MB" }
          Write-Output '上面每一步都真的跑过了：取权重 → tauri build → 核对装包内有权重。'
          Write-Output '=================================================='
