[workspace]
resolver = "3"
members = ["crates/core", "crates/capture", "crates/perceive", "xtask", "ui/src-tauri"]
# Tauri 的 Android/iOS 目标在 ui/src-tauri/gen 下生成，独立于本工作区构建，
# 排除掉免得门禁去扫它的 target。
exclude = ["ui/src-tauri/gen"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

# 版本在这里锁死一次，各 crate 只写 workspace = true。
# windows 必须与 windows-capture 2.0 的内部依赖对齐（它要 ^0.62.2），
# 升版本前先确认 windows-capture 的依赖表，见 docs/adr/0003。
[workspace.dependencies]
chatservant-core = { path = "crates/core" }
chatservant-capture = { path = "crates/capture" }
chatservant-perceive = { path = "crates/perceive" }

windows = { version = "0.62", features = [
  "Foundation",
  "Graphics_Capture",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Storage_Xps",
  "Win32_System_SystemInformation",
  "Win32_System_WinRT",
  "Win32_System_Threading",
] }
windows-capture = "2.0"
wgc = "2.0"

anyhow = "1"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true