[workspace]
resolver = "3"
members = ["crates/core", "crates/capture", "crates/perceive", "crates/reason", "xtask", "ui/src-tauri"]
# Tauri 的 Android/iOS 目标在 ui/src-tauri/gen 下生成，独立于本工作区构建，
# 排除掉免得门禁去扫它的 target。
exclude = ["ui/src-tauri/gen"]

# ── 工作区 lint 策略 ───────────────────────────────────────
#
# ## 为什么要加这个
#
# `scripts/gate.ps1` 早就在跑 `cargo clippy --workspace --all-targets -- -D warnings`，
# 也就是 **Effective Rust Item 32「Clippy in CI」早就做到了**。
# 但 Item 29 还有后半句没兑现：
#
# > "make your code Clippy-warning free. That way, when new warnings appear—
#    whether from changed code or from clippy being upgraded—**they will be obvious**."
#
# 没有 `[lints]` 段的时候，新警告淹没在 clippy 默认启用的几百条里，
# 做不到 obvious。机器门禁本来就有，**缺的是把策略写下来**——
# 那就是下面这个段本身。
#
# ## 判据来自哪
#
# `coding-guidelines`（actionbook/rust-skills，★1.4k，3/3 安全审计通过）给的是
# 一张 50 条规则 + `clippy-lints/` 映射表。按 §5.3 筛选判据第 4 条
# 「社区的就当**判据来源**，不当官方规范引用」使用——
# 取它指出的 lint 名，不引它整套规则。
#
# ## 为什么 `pedantic` 只 warn 不 deny
#
# pedantic 里大量是风格偏好（`must_use_candidate` 对本项目没有意义…）。
# 一上来全 deny 会产生几百条噪声，**噪声本身会让人忽略警告**——
# 那正好违背 Effective Rust 那条原则。**warn 起步，逐条升 deny。**
[workspace.lints.rust]
future-incompatible = "warn"
missing_docs = "warn"
# 每个 `unsafe` 块必须带 `// Safety:` 说明为什么安全。
#
# 这里**不用** `unsafe_code = "forbid"`。它做不到想要的效果：
# Cargo **不允许**同一个 package 既写 `lints.workspace = true` 继承工作区、
# 又用 `[lints.rust]` 覆盖其中一项——报 "cannot override workspace.lints in lints"。
# 也就是说「三个纯 crate forbid、capture 不 forbid」在 manifest 层面
# 根本表达不出来，除非让那三个 crate 把工作区的每一条 lint 手工抄一遍，
# 而抄一遍就会漂（本项目在事件名上吃过「两处各抄一份」的亏，
# 见 `ui/src-tauri/src/contract.rs` 的 `no_event_literal_outside_this_file`）。
#
# `undocumented_unsafe_blocks` 达到的是**同一个审查目的**，
# 而且对 `capture` 那 51 处 Win32 FFI 同样有效——
# 每处 `unsafe` 都必须写清楚为什么安全，这比"另外三个 crate 全面禁止"
# 更有价值：它管住了**唯一真正有 unsafe 的地方**。
#
# 这两条是 **clippy** 的 lint、不是 rustc 的，必须带 `clippy::` 前缀，
# 而且必须写在下面的 `[workspace.lints.clippy]` 段里。
# 写成裸名字 cargo 会报 "lint name is deprecated and may not have an effect"。

[workspace.lints.clippy]
all = { level = "deny", priority = 10 }
# 每个 `unsafe` 块必须带 `// Safety:` 说明为什么安全。理由见上。
undocumented_unsafe_blocks = "warn"
# 公开的 `unsafe fn` 必须有 `# Safety` 文档段。
missing_safety_doc = "warn"
# Effectiv Rust：能用 `?` 传播就别 match 链。
# 本项目 §5.4 B-2 点名的「恒哑的错误处理」靠人 review 抓不住，靠这个。
question_mark = "warn"
# 命名撒谎是这个项目的实际病灶（§5.4 B-2 表格第三行：
# 变量叫 `full` 实际是裁过的消息区，坐标换算连着错三次）。
# `similar_names` 抓的是 `x` / `xx` 这类近似名，本项目更适合 `allow`,
# 但**显式 allow 并写清理由**，好过它默认 warn 然后被忽略。
similar_names = "allow"

[workspace.package]
# ⚠ 版本号在这里改一处不够——**四处必须一起改**，否则发版闸会拦：
#   `Cargo.toml`（本行）/ `ui/package.json` / `ui/src-tauri/Cargo.toml` /
#   `ui/src-tauri/tauri.conf.json`。
#   门禁那一步 `version consistency`（scripts/check-version.ps1）会逐个点名。
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "BUSL-1.1"

# 版本在这里锁死一次，各 crate 只写 workspace = true。
# windows 必须与 windows-capture 2.0 的内部依赖对齐（它要 ^0.62.2），
# 升版本前先确认 windows-capture 的依赖表，见 docs/adr/0003。
[workspace.dependencies]
chatservant-core = { path = "crates/core" }
chatservant-capture = { path = "crates/capture" }
chatservant-perceive = { path = "crates/perceive" }
chatservant-reason = { path = "crates/reason" }

windows = { version = "0.62", features = [
  "Foundation",
  "Graphics_Capture",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Storage_Xps",
  "Win32_System_SystemInformation",
  "Win32_System_WinRT",
  "Win32_System_Threading",
    # ToolHelp 线程快照——`xtask thread-probe` 数进程线程数，用来定位线程泄漏。
    "Win32_System_Diagnostics_ToolHelp",
    # Windows 凭据管理器（API key 只存这里，绝不落普通文件）。
    "Win32_Security_Credentials",
    "Win32_Foundation",
    # 输入注入与剪贴板：按 UTF-16 码位打键、不移动鼠标、回读校验。
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
] }
windows-capture = "2.0"
wgc = "2.0"

anyhow = "1"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
# ── OCR：PP-OCRv6 的 ONNX 推理（`crates/capture/src/ocr_pp.rs`）──
#
# ⚠ **2026-10-18 订正：当初选 tract 的理由成立，但那个理由从没被量化过。**
#
# 原文（保留，因为它是真实的决策记录）：
# > 选 `tract-onnx` 而不是 `ort`：**纯 Rust**，不需要 ONNX Runtime 的 C++
# > 动态库。`ort` 会给一个装进 `C:\Program Files` 的应用塞一份额外二进制依赖，
# > 而这份程序是**单机、离线、零 token** 的——多一个运行时就是多一个装不上的理由。
#
# 同一台机器、同一张真实微信整窗裁出的消息区、同一份 PP-OCRv6 small 权重、
# release 构建、稳态中位：
#
# ```text
# tract-onnx 0.23.8    2501~2552 ms    <- 超 TICK(1000ms) 2.5 倍
# onnxruntime 4 线程      443~ 455 ms    <- 余量 55%
# ```
#
# **差 5.6 倍。** 三条排查都指向「是引擎本身，不是配置」：
#   1. tract 的运行时开关（`TRACT_AVGPOOL_SEPARABLE` / `TRACT_ENABLE_BLOCKED_CONV`）
#      逐个试过，**没有一个带来可测的变化**（14.07 / 13.91 / 13.89 s，5 遍合计）。
#   2. tract 用 rayon 全局池，`RAYON_NUM_THREADS` 从 12 扫到 2，
#      中位 2481 / 2555 / 2453 / 2443 ms —— **2 线程与 12 线程几乎一样**，
#      说明这份负载在 tract 里根本没有可并行的地方。
#   3. 并发两个进程只贵 1.35×（不是 2×），确认它并非单线程。
#
# ⇒ 「多一个 C++ 运行时」这条代价现在是**已知且有界的**，
# 「慢 5.6 倍导致产品上不了线」是**未知且无界的**。
#
# ⚠ **2026-10-18 第三次改，这次定了：默认后端翻成 `ort`**（见 ADR-0006）。
# 上一版这行写的是「默认仍是 tract —— 换不换由实测后的那一步决定，
# 不由这条注释决定」，而那一步当天就走完了。
# **tract 没有删**：`CHATSERVANT_OCR_BACKEND=tract` 立刻切回去，不必重编。
# 它仍是「不想引入二进制依赖」时的现成退路。
#
# 许可证：两个 crate 都是 MIT OR Apache-2.0（`cargo info` 核实过），
# 符合 ADR-0003 的门槛。`ort` 自带的 ONNX Runtime 二进制同为 MIT。
tract-onnx = "0.23"
# ⚠ `download-binaries` **不是可选项**：缺它链接期就报
# `LNK1181: 无法打开输入文件 add_ort_library_path_or_enable_feature_download-binaries_see_ort_docs.lib`
# ——错误信息里直接写着要开哪个 feature（2026-10-18 实测）。
# 代价是**构建时要下载一份 ONNX Runtime**（几十 MB）。
#
# ⚠ **「产物里多一个 DLL」这句是当时的推测，实测没成立**：
# `download-binaries` 把 ONNX Runtime **静态链进 exe**——把 `xtask.exe`
# 单独拷进一个零 DLL 的目录，仍能加载权重并跑出 10 行、无告警。
# 真正会多一个文件的是 `load-dynamic`（自己随包带 DLL）那条路。
ort = { version = "2.0.0-rc.10", default-features = false, features = [
    "ndarray",
    "std",
    "download-binaries",
] }
# 夹具 manifest 记 sha256，黄金测试据此报出「是哪一个夹具被改坏了」。
# RustCrypto 的 `sha2` 是 MIT OR Apache-2.0，符合本仓库的许可门槛（ADR-0003）。
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# 合成语料的 CER 测试（`crates/capture/tests/ocr_accuracy.rs`）要在 Rust 侧
# 复刻 `scripts/ocrbench/bench_lib.py` 的 `normalize`——其中第一步是 NFKC。
# ⚠ 不加它，Rust 侧只能删空白 + 小写，那与台架**不是同一把尺子**，
# 而 ADR-0006 第（四）节反复出错的正是「拿两把尺子比」。
# unicode-normalization 是 `Unicode Normalization Forms` 的参考实现，
# 与 Python 的 `unicodedata.normalize("NFKC", …)` 同源（同一份 UnicodeData）。
# 许可 MIT OR Apache-2.0，符合 ADR-0003。
unicode-normalization = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# ── dev profile：调试信息瘦身（实测 2026-10-10，另一台设备先做）──
#
# 之前根本没有 `[profile.dev]`，于是吃的是默认值 `debug = 2`（**全量**
# 调试信息）。单 `chat_servant_app.pdb` 就173 MB，加上反复改配置留下的
# 旧 PDB，`target/debug` 一度到 **6.8 GB**、`target` 合计 **8.4 GB**。
# 整个工作区的构建产物全部躺在项目里，而这是唯一一台机器。
#
# ## `debug = 1` 而不是 `0`
#
# `1` = 只保留**行号表**：断点还能落在正确的行上，panic 回溯还带行号，
# 但不再携带完整类型与变量信息。`0` 会把行号表也砍掉，断点直接失效——
# 那等于把调试能力换成了空间，不划算。
#
# 用 `-D warnings` 的门禁跑不到这里；`debug` 不影响正确性，
# 只影响产物大小和调试体验，所以它不属于 lint 策略那一层。
[profile.dev]
debug = 1
# 增量编译**全局关掉**（2026-10-14 实测后定）。
#
# ## 两条依据，都是实测的，不是偏好
#
# ① **它有害**：`scripts/gate.ps1` 早就在开头设 `$env:CARGO_INCREMENTAL = "0"`，
#    注释记着原因——增量目录会被另一个进程锁住（os error 5），clippy 因此
#    以 101 退出，而那不是代码红。⇒ 门禁早就认定它有害，只是**只在门禁运行
#    期间**关，日常 `pnpm tauri dev` / `cargo build` 仍是默认的 true。
#    这里把它从「临时环境变量」升格成全局配置，两条路径从此一致。
#
# ② **它是累积的大头**：同机实测（2026-10-14，target 清空后全新构建对比）
#        全新一次构建   incremental = 0.18 GB
#        日常反复构建后 incremental = 3.88 GB     ← 21 倍
#    而 `deps` 是 1.90 → 10.55 GB（5.5 倍），`targetaudit.py` 查过多哈希
#    残留只占 deps 的 **1%** ⇒ 膨胀来自**逐轮叠加**，不是残留，
#    所以调 profile 与回收机制才是对症的药，`cargo clean` 只能救急。
#
# 代价：改 Rust 代码后重编更慢（全量约 2 分钟，实测 `cargo build --workspace`）。
# 本项目的日常改动大头在前端（`.svelte` / `.css` 走 Vite HMR，不碰这里），
# Rust 侧改动频率低，这个代价可以接受。
#
# 改 `[profile.*]` 任何一项都会让**整份产物重编、旧的一整套整体留下**。
#    所以改这一行之前先 `cargo clean --profile dev`，否则 target 会短暂翻倍。
incremental = false

# 依赖 crate **不要**调试信息。
#
# 这一条才是大头：`target/debug/deps` 实测 3.5 GB，光 `libwindows-*.rlib`
# 一个就 201 MB。而我们从来没有断进 `windows` / `tauri` 里去——
# 要断的是自己那几百行。给依赖留全量调试信息，是为一个从没用过的能力
# 付每一兆。
[profile.dev.package."*"]
debug = 0