[package]
name = "chatservant-capture"
description = "窗口发现与 Windows Graphics Capture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# 内部 crate，不发 crates.io。理由同 crates/core。
publish = false

[dependencies]
chatservant-core.workspace = true
# `PaneAnchor` 要能直接发给 UI 渲染。边界不变：判定仍在 Rust 侧。
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
windows.workspace = true
windows-capture.workspace = true
wgc.workspace = true
# 图片链路：重采样交给 `image`，不自己实现插值（票 07 明确写了这一条）。
image.workspace = true
# API 的图块要 base64。只取编码那一半，不引解码与全部算法。
base64 = { version = "0.22", default-features = false, features = ["std"] }
# 预下载 OCR 模型（**PP-OCRv6 small** ONNX 导出）。
# ⚠ 下面这两行曾经写着「PP-OCRv4 / 纯 Rust 推理，不引 C++ 运行时 /
# 见根 Cargo.toml 里为什么选它而不是 `ort`」——**三句都过期了**：
# 权重换成 v6、默认后端已翻成 `ort`。`tract` 还在，但现在是显式回退。
# 选型经过写在根 Cargo.toml 那一段里，结论在 ADR-0006。
tract-onnx.workspace = true
# 见根 Cargo.toml 里为什么**两个**后端都留着、以及哪个是默认。
ort = { workspace = true }

# ── 仅测试期（不进产物）──
# `tests/ocr_accuracy.rs`：要读台架生成的 `truth.json`，且要在 Rust 侧复刻
# `bench_lib.normalize` 的 NFKC 一步，否则与 Python 台架不是同一把尺子。
# ⚠ `serde_json` 根 Cargo.toml 里**已经**是工作区依赖（别再抄一份版本号，
# 那是两处会分叉的数）；`unicode-normalization` 是本轮新增。
[dev-dependencies]
serde_json.workspace = true
unicode-normalization.workspace = true

# ── 继承工作区 lint 策略（见根 Cargo.toml 的 `[workspace.lints]`）──
#
# Effective Rust Item 29：让代码 clippy-warning-free，
# 新警告出现时才「obvious」。`gate.ps1` 早就在跑 clippy，
# 缺的是把策略**写下来**——这段就是那个策略。
[lints]
workspace = true
#
# **这里不 forbid unsafe。** 2026-10-10 实测：本 crate 有 51 处
# `unsafe`——`SendInput`、`OpenClipboard`、COM 激活，全是 Win32 FFI，
# 绕不开。所以工作区级别的 `unsafe_code = "forbid"` 只能加在
# core / perceive / reason 那三个纯逻辑 crate 上。
# 本 crate 的 unsafe 应该配 `# Safety` 文档与
# `undocumented_unsafe_blocks` 警告，而不是 forbid。
