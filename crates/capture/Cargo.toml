[package]
name = "chatservant-capture"
description = "窗口发现与 Windows Graphics Capture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# 内部 crate，不发 crates.io。理由同 crates/core。
publish = false

[dependencies]
chatservant-core.workspace = true
# `PaneAnchor` 要能直接发给 UI 渲染。边界不变：判定仍在 Rust 侧。
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
windows.workspace = true
windows-capture.workspace = true
wgc.workspace = true
# 图片链路：重采样交给 `image`，不自己实现插值（票 07 明确写了这一条）。
image.workspace = true
# API 的图块要 base64。只取编码那一半，不引解码与全部算法。
base64 = { version = "0.22", default-features = false, features = ["std"] }