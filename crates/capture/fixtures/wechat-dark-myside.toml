# 夹具 wechat-dark-myside
#
# 由 `cargo xtask fixture --name wechat-dark-myside --source <png>` 生成。
# 原始帧含真实联系人名与消息正文，**不入库**。
#
# 脱敏分两步：①按**面积**挑出布局色（面板/侧边栏/两侧气泡/选中行/边框线），
# 整帧切 8x8 的块，每块记下块内最多的布局色作为它的**底色**；
# ②渲染时，凡是与所在块底色不是同一片表面的像素，一律刷成块底色。
# 空块（头像/图片）向邻近块**传播**底色，不往全局找。
#
# 生成时会当场校验三件事，任何一条不成立就拒收、不写盘：
#   · 产物的每个像素都在保留色内（调色板封闭）
#   · 锚点 chat 矩形与脱敏前逐像素相同
#   · 学到的面板底色与脱敏前相同
# 更新基线需手动删掉 png 再重跑——不允许静默覆盖。
#
# 锁的是几何与配色，不锁 OCR 读出的文字内容（夹具里本来就没有文字）。
         
width = 1262
height = 958
chat_x0 = 304
chat_y0 = 31
chat_x1 = 1260
chat_y1 = 683
panel_bg = [30, 30, 31]
# 补记：这两个夹具早于 sha256 校验而生成，PNG 字节未变。
# 黄金测试启动时会逐字节核对，对不上直接报「是哪一个夹具被改坏」。
sha256 = "4ddafa27edcecdee853824df56d65cb5dfbba76e67d216fa270896dbb22959d7"
