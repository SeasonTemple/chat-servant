[package]
name = "chatservant-core"
description = "域类型与不依赖平台的纯逻辑"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# 内部 crate，不发 crates.io。标出来 cargo-deny 才会把
# `deps.workspace = true` 当作普通工作区继承而不是"要发布的 path 依赖"。
publish = false

[dependencies]
# `Rect`/`PaneAnchor` 要能直接发给 UI 渲染。**这不改变边界**——
# 几何判定仍然只在 Rust 侧，前端拿到的坐标只用来画，不用来重算。
serde = { workspace = true }
thiserror.workspace = true