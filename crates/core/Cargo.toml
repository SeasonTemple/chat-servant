[package]
name = "chatservant-core"
description = "域类型与不依赖平台的纯逻辑"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# 内部 crate，不发 crates.io。标出来 cargo-deny 才会把
# `deps.workspace = true` 当作普通工作区继承而不是"要发布的 path 依赖"。
publish = false

[dependencies]
# `Rect`/`PaneAnchor` 要能直接发给 UI 渲染。**这不改变边界**——
# 几何判定仍然只在 Rust 侧，前端拿到的坐标只用来画，不用来重算。
serde = { workspace = true }
thiserror.workspace = true

# ── 继承工作区 lint 策略（见根 Cargo.toml 的 `[workspace.lints]`）──
#
# Effective Rust Item 29：让代码 clippy-warning-free，
# 新警告出现时才「obvious」。缺的是把策略**写下来**——
# 这段就是那个策略。
#
# ⚠ **为什么 per-crate 的 `unsafe_code = "forbid"` 不写在这个文件里，
# 而在 `src/lib.rs`。** cargo **不允许「继承 + 局部覆盖」并存**：只要这里
# 写 `[lints.rust]`，就报 `cannot override workspace.lints in lints`，
# 整个工作区连 manifest 都解析不了（2026-10-10 本机 cargo 1.98 实测）。
# 两条出路——手抄一遍工作区策略（三份副本，必然漂移），
# 或把 per-crate 的锁挪进源码。选后者：
# 策略仍由根 Cargo.toml 单一出处，per-crate 不变量写在
# unsafe 唯一可能出现的那一行里。
# 本 crate 2026-10-10 实测：全树 `unsafe` 只出现在 capture，这里 0 处，
# 所以这条 forbid 是守得住的。
[lints]
workspace = true
