[package]
name = "chatservant-perceive"
description = "感知层：把 OCR 框归类成对话人与噪声类"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# 内部 crate，不发 crates.io。缺这一行 cargo-deny 会把
# `deps.workspace = true` 判成通配符（allow-wildcard-paths 对公开 crate 不生效）。
publish = false

[dependencies]
chatservant-core.workspace = true
# `Message`/`Speaker` 要能直接发给 UI 渲染。边界不变：归并仍在 Rust 侧。
serde.workspace = true
# OCR 的**数据结构**（带坐标的 OcrLine）放在 capture crate 里。
# 这里只依赖它的类型，不依赖它的实现——采集层与感知层之间只过数据。
chatservant-capture.workspace = true
thiserror.workspace = true

[dev-dependencies]
# 黄金测试要读 crates/capture/fixtures/*.png。只开 png 特性，不引其他编解码器。
image.workspace = true
# 夹具自证：manifest 里记 sha256，测试启动时校验字节没被改过。
# RustCrypto 的 `sha2` 是 MIT OR Apache-2.0，符合本仓库的许可门槛。
sha2 = "0.10"
