[package]
name = "chatservant-reason"
description = "推理层：判断意图、起草候选、排序"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# 内部 crate，不发 crates.io。缺这一行 cargo-deny 会把
# `deps.workspace = true` 判成通配符（allow-wildcard-paths 对公开 crate 不生效）。
publish = false

[dependencies]
chatservant-core.workspace = true
chatservant-perceive.workspace = true
serde = { workspace = true }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

# HTTP 传输。选 ureq 而不是 reqwest 的理由（三条，都是实测/读文档得来的）：
#   ① **阻塞 I/O**。推理层每条新消息最多 3 次调用，异步运行时买不到任何东西，
#      却要多背一整个 tokio 依赖树。
#   ② **必须显式开 TLS 后端**。`native-certs` 只是**证书加载器**
#      （`native-certs = ["dep:rustls-native-certs"]`），自身不带 TLS 实现——
#      早先只写了 `json/gzip/native-certs`，于是 ureq 压根发不出 HTTPS，
#      报 `no TLS backend is configured`。真正的后端是 `tls`（rustls）。
#      它会拖进 `webpki-roots`（MPL-2.0），已在 deny.toml 里具名论证。
#      ⚠ 原来那句「为一份证书数据破门禁不划算」写于误判 `native-certs`
#      自带 TLS 的时候——**那个意图没有实现成**，这里如实记下来。
#   ③ `reason` 是核心 crate，**绝不能依赖 tauri**。reqwest 目前只在树里
#      （由 tauri 带入，且仅限桌面目标），依赖它等于让核心依赖壳——架构倒过来。
ureq = { version = "2", default-features = false, features = [
  "json",
  "gzip",
  "native-certs",
  "tls",
] }

[dev-dependencies]
