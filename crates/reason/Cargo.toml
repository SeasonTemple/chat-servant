[package]
name = "chatservant-reason"
description = "推理层：判断意图、起草候选、排序"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# 内部 crate，不发 crates.io。缺这一行 cargo-deny 会把
# `deps.workspace = true` 判成通配符（allow-wildcard-paths 对公开 crate 不生效）。
publish = false

[dependencies]
chatservant-core.workspace = true
chatservant-perceive.workspace = true
serde = { workspace = true }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

# **泛用 LLM provider 客户端。** ADR-0003 的 crate 选型表里它是「首选」，
# 而协议层那 ≈120 行（请求体拼装 / 响应解析 / 鉴权头 / 端点 / 错误分类）
# **本应交给 genai**。2026-10-12 落地：hand-written 的 `transport` 协议层
# 与 `ureq_http` 已删，现在 `genai` **就是**传输层。
#
# 早先不换的理由是许可证门禁，而**那条理由 ADR 自己已经推翻**：
# `webpki-roots` 实为 `CDLA-Permissive-2.0`（不是早先误记的 MPL-2.0），
# 已在 deny.toml 的 allow 白名单里，不需要任何豁免。
#
# 接缝层（`Reasoner` 三段 / 降级 / `redact`）**自己写**，不外包——
# 那 ≈120 行是「我们怎么问」，不是「各家协议长什么样」。
genai = { version = "0.6", default-features = false, features = ["rustls-tls"] }

# **只给「测连通性」那一个 GET 用**，理由三条：
#   ① genai 的 `WebClient` 是 `pub(crate)`，外部拿不到；`all_model_names`
#      对非 Ollama 适配器返回的是**静态清单**，根本不联网。
#   ② `/v1/models` 不是任何一个适配器的操作，genai 没有它的等价物。
#   ③ 版本与 genai 内部那条**完全一致**（0.13）→ 依赖树里**不新增任何 crate**，
#      也没有第二个 TLS 栈。genai 的 `rustls-tls` 就是转发到 `reqwest/rustls`，
#      这里写 `rustls` 是为了**显式**而不是碰巧被 feature 合并带上。
reqwest = { version = "0.13", default-features = false, features = [
  "charset",
  "rustls",
] }

# **async → sync 的桥。** genai 全是 async，而 `Reasoner` trait 必须保持同步
# （seam 层、`xtask` 的注入探针、界面上的计数全靠它）。
#
# 桥接放在 **`reason` 自己**而不是 ADR-0003 建议的 `src-tauri`：
# `xtask` 也要用**真实传输**跑 e2e / 注入探针，而 `xtask` 依赖不到 `src-tauri`。
# 放一处两边都能用，否则就得把协议层复制一份给 xtask —— 而复制的那份
# 正是这次要删掉的东西。
#
# `net` / `time` 是**显式**写出来的：reqwest 自己会开这两个 feature，
# 所以只写 `rt` 现在也能跑，但那是**依赖别人的 feature 选择**——
# 上游哪天改了自己的 tokio features，我们的 `block_on` 会静默地没有
# I/O 驱动器，症状是「单测全绿、真调用一挂就错」。
tokio = { version = "1", default-features = false, features = [
  "net",
  "rt",
  "time",
] }

[dev-dependencies]

# ── 继承工作区 lint 策略（见根 Cargo.toml 的 `[workspace.lints]`）──
#
# Effective Rust Item 29：让代码 clippy-warning-free，
# 新警告出现时才「obvious」。缺的是把策略**写下来**——
# 这段就是那个策略。
#
# **为什么 per-crate 的 `unsafe_code = "forbid"` 写在 `src/lib.rs`
# 而不在这里。** cargo **不允许「继承 + 局部覆盖」并存**：只要这里写
# `[lints.rust]`，就报 `cannot override workspace.lints in lints`，
# 整个工作区连 manifest 都解析不了（2026-10-10 本机 cargo 1.98 实测）。
# 策略仍由根 Cargo.toml 单一出处，per-crate 不变量写在源码里。
[lints]
workspace = true
