# cargo-deny 依赖合规策略
#
# 目标：**任何依赖都不得给商业使用带来麻烦。**
# 做法：只允许宽松许可（permissive），copyleft / 商业限制 / 无许可证一律拒绝。
#
# 首次配置用 `cargo deny init` 生成官方模板后并入本文件。
# 日常校验：`cargo deny check`（advisories + licenses + bans + sources）

[licenses]
# 策略本身：只允许 permissive 白名单。
#
# 未列出的许可证、未声明许可证的 crate、许可证正文识别不出来的 crate，
# cargo-deny 全部按"拒绝"处理（这三条都是它的默认值，不需要显式写）。
# 白名单是唯一的开口——往里加一行要能说清楚理由。
#
# 从许可证正文推断时的置信度门槛，调高更保守。
confidence-threshold = 0.92

# 允许清单：全部是 permissive，闭源商用无义务、无源码披露要求。
# SPDX v2.1 标识符，注意 Apache-2.0 带显式专利授权。
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "BSL-1.0",          # Boost，permissive
  "CC0-1.0",          # 公有领域奉献
  # CDLA-Permissive-2.0：社区数据许可证的**宽松**变体（对照 CDLA-Sharing 是
  # copyleft）。它就是为「数据」设计的：允许使用/修改/再分发，唯一义务是
  # 保留声明。webpki-roots 用它装 Mozilla 的根证书集合——名副其实的数据包，
  # 没有可审的代码逻辑，所以归进 permissive 白名单而不是 exceptions。
  #
  # ⚠ 早先这里按 crates.io 页面上的旧标注以为是 MPL-2.0，**是错的**：
  #   0.26.11 与 1.0.9 的 Cargo.toml 都写的是 CDLA-Permissive-2.0。
  #   许可证从 **crate 的 Cargo.toml 元数据**确认，不从主页推测（AGENTS.md）。
  "CDLA-Permissive-2.0",
]

# 明确点名拒绝——allow 里不写就默认拒绝，写出来是为了让读者一眼看到意图，
# 并且能在有人手滑加进 allow 时立刻看到冲突。
#
# GPL / AGPL / LGPL / MPL：copyleft，会传染分发包。
#   参考项目就踩过这个坑——它自己的代码是 MIT，但发布包捆绑了
#   GPLv3 的 PySide6-Fluent-Widgets，导致整个分发包受 GPLv3 约束。
#   本项目不吃这个教训。
# "BSL-1.0" 已在 allow：Boost 是 permissive，与 Boost 的衍生商业条款不同。
#
# 源码可见但限制商业使用的（如 BUSL、SSPL、Elastic License、"非商业免费"）
# 一律不写进 allow，靠 default-deny 兜住。
#
# 白名单之外可以开**具名例外**，但每一条都要重新论证。
#
#   MPL-2.0（弱 copyleft）的例外是**选 Tauri 2 的既定代价**，共六条，
#   理由逐条写在下面 exceptions 上方。要点：
#     · MPL-2.0 只要求「改动该 crate 本身要开源」，链接使用**不传染**
#       整个分发包——这与 GPL/LGPL 的传染性不同。
#     · 本项目源码是 BUSL 1.1（`LICENSE`），**不修改**这些 crate，不分发它们的源码。
#     · 但要注意：cssparser / selectors / dtoa-short / option-ext 是
#       **运行时**依赖（wry 的 WebView 绑定层），会进最终二进制。
#       这不是"构建期所以无所谓"。
#
#   判据：
#     · 换 Tauri 大版本或换框架时，**必须重新跑 cargo deny**，
#       不要假设还是这几个 crate——上游依赖树会变。
#     · 若将来引入**别的** copyleft 依赖，**不能**顺手加进来，
#       新增一行必须重新论证，不许「反正已经破例了」。
#
# ⚠ `exceptions` 必须写在 `[licenses]` **表内**，不是独立子表
#   （`[licenses.exceptions]` 会报 "expected an array"，cargo-deny 0.20 实测）。
# ⚠ 这四个是 **Tauri 2 的 wry（WebView 绑定层）在 Windows 上的运行时依赖**，
#   不是构建期依赖，会进最终二进制：
#     cssparser  0.37.0 —— HTML/CSS 解析
#     selectors  0.38.0 —— CSS 选择器匹配
#     dtoa-short 0.3.5  —— 浮点格式化（渲染属性用）
#     option-ext 0.2.0  —— Option 扩展
#   它们的代码生成宏（cssparser-macros / selectors-macros）同样是 MPL-2.0，
#   但宏只在编译期展开，不进二进制。
#
#   这里把它们列进来**不是**"它们安全"，而是要让读的人知道：
#   选 Tauri 2 就等于接受这几个 MPL-2.0 crate 进分发包。
#   换个 Tauri 版本或换框架时，**必须重新跑 cargo deny**，不要假设还是这几个。
#
# ## 最后一条例外为什么是 `private = true`
#
# 本项目**自己**以 **BSL 1.1** 发布（2029-10-12 转 Apache-2.0，见 `LICENSE`）。
# 上面那张白名单只管**依赖**：任何**别人写的** crate 进来，商业使用都不得有麻烦，
# 所以 BUSL / SSPL / Elastic 一律默认拒绝（ADR-0003）。
#
# 「自己用 BUSL」与「依赖一个 BUSL crate」是两件事。把 BUSL-1.1 写进上面的
# `allow`，等于给依赖悄悄开了口子——那才是真正的策略漏洞。
#
# `private = true` 这条路走不通：cargo-deny 0.20.2 的 exceptions 不认 `private`
# 键（实测报 unexpected keys, expected: ["allow"]），所以只能按 **crate 名**点名。
# 这依然安全——`chatservant-*` / `xtask` / `chat-servant-app` 全是 `publish = false`
# 的本仓包名，外部依赖占用不了；就算真有人发布了同名 crate，那也是我们自己的包。
#
# ⚠ 另外两条 cargo-deny 0.20 实测限制，写下来免得下一个人重试：
#   ① `[licenses.private]` 表**没有** `allow` 键（只认 ignore / ignore-sources /
#      registries），所以只能走 exceptions；
#   ② exceptions 的每一项**必须**带 `crate`（想写"所有私有 crate"也不行）。
#   于是这里只能逐个点名——**新增工作区成员时记得补一行**，否则 cargo deny 会以
#   "license is not explicitly allowed" 失败。补的时候让 `cargo metadata` 当裁判。
exceptions = [
  { allow = ["MPL-2.0"], crate = "cssparser" },
  { allow = ["MPL-2.0"], crate = "cssparser-macros" },
  { allow = ["MPL-2.0"], crate = "selectors" },
  { allow = ["MPL-2.0"], crate = "selectors-macros" },
  { allow = ["MPL-2.0"], crate = "dtoa-short" },
  { allow = ["MPL-2.0"], crate = "option-ext" },
  { allow = ["BUSL-1.1"], crate = "chatservant-core" },
  { allow = ["BUSL-1.1"], crate = "chatservant-capture" },
  { allow = ["BUSL-1.1"], crate = "chatservant-perceive" },
  { allow = ["BUSL-1.1"], crate = "chatservant-reason" },
  { allow = ["BUSL-1.1"], crate = "xtask" },
  { allow = ["BUSL-1.1"], crate = "chat-servant-app" },
]

[licenses.private]
# 不查本 crate 自身的私有依赖树。默认 false，显式写出来是为了让读的人知道
# 这里想过这件事。
ignore = false

[advisories]
# 已知漏洞 / 不可维护的 crate 直接失败。
unmaintained = "workspace"
yanked = "warn"

# 每一条豁免都要写清 RUSTSEC 编号与理由。没有编号的豁免一律不接受——
# 「暂时忽略」不是理由。
ignore = [
  # RUSTSEC-2026-0194 / -0195：quick-xml 0.38.x 的两个 DoS
  #   （① 检查重复属性名时运行时间二次增长；② NsReader 命名空间声明无上限分配）
  #
  # 为什么绕不开：`quick-xml` 只能经 `plist` → `tauri-utils` 进来，
  # 而 `plist 1.8.0` 把 `quick-xml` 钉在 `^0.38`，修复版是 **0.41**——
  # 跨大版本，必须上游 `plist` 先升 `quick-xml`。cargo update 到不了。
  #
  # 为什么对本项目不构成风险：
  #   · `plist` 在 Tauri 里**只用于 macOS 的 Info.plist 处理**
  #     （见 tauri-utils/src/config.rs 的 info_plist / LSMinimumSystemVersion）。
  #     本项目是纯 Windows 构建（bundle targets 只有 msi / nsis），
  #     这条路径根本不会执行。
  #   · 两个漏洞都要**解析攻击者可控的 XML**才会触发。plist 读的是
  #     自己工程目录下的 Info.plist，不是网络输入。
  #   · `plist` 出现在 `tauri-build` 的依赖树里，属**构建期**，
  #     不进最终二进制的运行时。
  #
  # 复审条件（满足任一就要重看这条豁免）：
  #   · 本项目要支持 macOS —— 那时这条豁免**立刻失效**，必须先让上游修好。
  #   · 上游 plist 升到用 quick-xml 0.41+ —— 那就直接删掉这条豁免。
  #   · 半年内上游没动静 —— 重新评估是否值得为它绕开 Tauri。
  { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.38 DoS；plist 钉死 ^0.38 修不了。仅 macOS Info.plist 路径用，本项目纯 Windows，且只解析本工程文件" },
  { id = "RUSTSEC-2026-0195", reason = "同上：quick-xml NsReader 命名空间无上限分配。同为 macOS-only 构建期路径" },
]

[bans]
# 同名 crate 的多个主版本并存：警告（tui 生态常见，不一定有问题）。
multiple-versions = "warn"
# 通配符版本要求（`foo = "*"`）是供应链隐患，禁止。
wildcards = "deny"
# 但放过 `foo.workspace = true`：它继承工作区里声明的具体版本，
# 不是真正的通配符，被 wildcards 拦下是误报。
allow-wildcard-paths = true
deny = [
  # 需要 OpenSSL C 库，会让 Windows 构建变脆。统一走 rustls。
  # ⚠ `openssl-sys` 被挪到下面的 `skip` 了——原因写在那里，这里保留原规则本身。
  #   cargo-deny 不允许同一个 crate 同时出现在 `deny` 与 `skip`。
]
# ⚠ 2026-10-18：`ort`（ONNX Runtime 后端）把 `openssl-sys` 顶到了构建期依赖的
#   构建期依赖上，理由写全在下面。
#
# ## 事实：它在这里**不进任何交付物**
#
# ```text
# openssl-sys <- native-tls <- ureq  [build-dependencies]  ort-sys  ort  chatservant-capture
# ```
#
# `ureq` 是 **`ort-sys` 的 build-dependency**，用途只有一个：
# 构建时从 CDN 下一份 ONNX Runtime 的二进制包。
# **它不进我们的二进制，运行时也不加载它。**
# 原禁令的理由是「需要 OpenSSL C 库会让 Windows 构建变脆」，
# 而**这里的 OpenSSL 从不被链接**，所以那个理由对本例不成立。
#
# ## 为什么接受它，而不是改用 `load-dynamic`
#
# 两种接法（`download-binaries` / `load-dynamic`）二选一：
# - `download-binaries`：**静态链接** ONNX Runtime，**不需要随包带 DLL**。
#   实测本机构建后 `target/` 下**找不到任何 onnxruntime.dll**，而推理照常跑通。
# - `load-dynamic`：没有 ureq，也就没有 openssl，但**必须随应用带一份
#   `onnxruntime.dll`**（十几 MB），而本机**没有**这份 DLL 可供验证。
#
# 对一个要装进 `C:\Program Files` 的桌面应用，
# **少一份需要随包投递的 DLL** 比多一条只存在于构建期的 TLS 依赖更要紧。
#
# ## 撤销方式
#
# 不接受的话：把下面这行挪回上面的 `deny` 并删掉 `skip`，
# `cargo deny check` 立刻恢复成红——那正是本条的护栏。
skip = [
  { name = "openssl-sys" },
]
skip-tree = []

[sources]
# 只允许 crates.io。引入 git 依赖需要在此显式列出并说明理由。
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []