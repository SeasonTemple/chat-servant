<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 副驾的图标：一个贴着气泡的半透明面板。
       设计取向：深色底 + 我方绿的一条，暗示"我发的"，
       不画完整气泡——这个工具永远只是"在旁边看着"，不是主角。 -->
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3f" />
      <stop offset="1" stop-color="#1c1c1e" />
    </linearGradient>
    <linearGradient id="mine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fe0a4" />
      <stop offset="1" stop-color="#4aa86c" />
    </linearGradient>
  </defs>

  <rect x="64" y="72" width="384" height="368" rx="72" fill="url(#panel)" />
  <rect x="64.5" y="72.5" width="383" height="367" rx="71.5" fill="none"
        stroke="#ffffff" stroke-opacity="0.14" stroke-width="3" />

  <!-- 对面说的话：灰 -->
  <rect x="112" y="136" width="176" height="52" rx="26" fill="#8a8a94" />
  <!-- 我说的话：绿 -->
  <rect x="224" y="224" width="176" height="52" rx="26" fill="url(#mine)" />
  <!-- 又一条 -->
  <rect x="112" y="312" width="132" height="52" rx="26" fill="#8a8a94" />

  <!-- 停在输入框的光标：暗示"填好等你按"，不自动发 -->
  <rect x="300" y="330" width="4" height="28" rx="2" fill="#7fe0a4" />
</svg>