[package]
name = "chat-servant-app"
version = "0.1.0"
description = "桌面聊天回复助手的界面外壳"
# 与工作区其它 crate 一致用 2024 edition，才能用 let-chain（`if let … && let …`）。
# Tauri 模板默认给 2021 —— 那样写不了 let-chain，所以显式提到 2024。
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

[lib]
# Tauri 2 把移动端目标放进同一个 crate，必须显式声明这个 name，
# 否则 `cargo build` 会因为 crate 名里的连字符而找不到库。
#
# 桌面端不需要这个库——所以它只有一个空的 lib.rs，真正的主程序在 main.rs。
# 移动端目标（iOS/Android）需要它来导出入口，所以保留。
name = "chat_servant_app_lib"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# 与 tauri 同次版本，`tauri-build` 生成的代码才和运行时对得上。
# 用 `=` 钉死：`2.6` 会解析到 2.7，而 tauri 已经是 2.12，
# 于是 build 产物与运行时不匹配，tauri build 直接拒绝。
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
chatservant-core = { path = "../../crates/core" }
chatservant-capture = { path = "../../crates/capture" }
chatservant-perceive = { path = "../../crates/perceive" }
chatservant-reason = { path = "../../crates/reason" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing.workspace = true
# 以前**没有**这个依赖，也**从来没初始化过 subscriber**——
# 于是 `commands.rs` / `watch.rs` 里所有 `tracing::info!` / `warn!`
# 全部打进了虚空，应用**一行日志都没输出过**。它完全不可观测，
# 出了事只能靠猜。没有它，观察循环里的诊断语句等于没写。
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Windows 凭据管理器。必须与工作区里的 windows 版本一致——
# 同一个 HWND / CREDENTIAL 跨 crate 版本传指针是不安全的。
windows = { workspace = true }
# 版本必须与 `@tauri-apps/api` 的 **次版本**对齐，tauri build 会硬性检查：
#   Found version mismatched Tauri packages: tauri (v2.11.6) : @tauri-apps/api (v2.12.1)
# 改 node 依赖时这里要跟着动，不是「宽松点没关系」。
#
# `image-png` 是为托盘图标加的：Windows 上 `default_window_icon()` 是从**可执行文件
# 的图标资源**里取的，而那份资源只有 `tauri build` 打安装包时才嵌进去——
# `cargo` / `tauri dev` 出来的二进制里没有，于是 dev 模式下它恒为 `None`，
# 托盘 `NIM_ADD` 带了个空 `hIcon`，**通知区里留了一格空白**（tooltip 照常，
# 因为那是我们自己写的文本）。所以图标得自己解一份 PNG 带进去。
# `image` / `png` 本来就在依赖树里（许可证均为 MIT OR Apache-2.0，由
# `cargo deny check` 守着），开这个 feature 不引入新的许可证面。
tauri = { version = "=2.12.1", features = ["tray-icon", "image-png"] }
