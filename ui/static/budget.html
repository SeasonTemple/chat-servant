<!doctype html>
<!--
  票 44 的排版量具 —— 量真面板里每一段的**实际**几何。

  ## 为什么需要它

  `stripgen.py` 从面板自己的位图裁下真撕边，`SLICE = 32`（源 px）= **16 CSS px**。
  而 2026-10-16 上午那版用 3px 时记的实测是「余量只有 4px」。
  两者差 **92px**，而那个「4px」是**上一轮量具记下的数**，不是这一轮量出来的。

  ⚠ 本项目的教训：**记下来的数会跟代码对不上**（`SLICE` 当天就从 20 调到 6）。
  ⇒ 动手腾空间之前先重新量。

  ## 为什么用 iframe 而不是直接改面板

  ⚠ 改 `PaperPanel.svelte` 加临时输出 = 往产品代码里塞调试代码，
  忘了删就进仓库。而同源 iframe 可以量到**真实渲染结果**，
  量具本身不碰产品代码一行。

  ## ⚠ 同源是前提

  iframe 要读 `iframe.contentDocument`，必须同源。
  本文件在 `ui/static/` 下，由 dev server 提供 ⇒ 与 `/panel` 同源 ⇒ 可读。
  若被 SvelteKit 拦成 404，先确认 static 目录的服务方式。

  ## 输出

  量到的 JSON 写进 `#out`（`<pre>`）。**键名一律 ASCII**：
  控制台与文件编码在 Windows 上是 GBK/UTF-16，中文键名会被吃掉。
-->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>budget</title>
    <style>
      html,
      body {
        margin: 0;
        background: #222;
        color: #eee;
        font: 12px/1.4 monospace;
      }
      #host {
        display: flex;
        gap: 12px;
        padding: 8px;
      }
      iframe {
        width: 380px;
        height: 560px;
        border: 1px solid #555;
      }
      pre {
        white-space: pre-wrap;
        word-break: break-all;
        max-width: 520px;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="host">
      <pre id="out">booting</pre>
      <pre id="verdict">…</pre>
      <div id="frames"></div>
    </div>
    <script>
      const STATES = [
        { key: 'drafted', url: '/panel/?demo=1&state=drafted' },
        { key: 'auto', url: '/panel/?demo=1&state=auto' },
        { key: 'sent', url: '/panel/?demo=1&state=sent' },
        // 2026-10-16 加：设置态。它和主面板共用一张纸（§1 第 2 条反转后），
        // 所以**必须一起量** —— 只看主面板会漏掉「纸没画满元素框」这类问题，
        // 而它在设置屏上最明显（冷灰铺满时被盖住，改回纸族后整条露出来）。
        { key: 'settings', url: '/panel/?demo=1&state=drafted&settings=1' },
        // 2026-10-16 加：5 条候选（复核夹具，不在八态里）。
        //   ⚠ 它是**唯一能把档位行挤出纸**的样本 —— 出图目测发现的，
        //     而目测只敢信「东西不见了」，不敢信「差多少」。
        //   ⇒ 必须进量具，`tier.bottom` vs `sheet.bottom` 才有数。
        { key: 'many', url: '/panel/?demo=1&state=many' },
        // 2026-10-23 加（票 88）：**长草稿**那一态。
        //   ⚠ `many` 是「候选太多」，这一态是「**草稿太长**」——两者挤掉的是不同的东西：
        //   `many` 挤掉的是**备选**（档位行没事），这一态挤掉的是**档位行**
        //   （草稿是 flex 项且默认 `min-height: auto` ⇒ 它不肯比自己内容更矮
        //     ⇒ 顶出纸外 ⇒ `.cs-sheet` 的 overflow hidden 把它**静默裁掉**）。
        //   ⇒ 档位行是「我现在在哪一档」的唯一显示，而 Auto 档不可逆
        //   ⇒ 那是最不能被裁掉的一行。
        { key: 'longdraft', url: '/panel/?demo=1&state=longdraft' },
        // 2026-10-24 加（票 91）：**长草稿 + 自动发送档**。
        //   ⚠ 这是**最狠的组合**：长草稿让正文区被滚动容器切，
        //   Auto 档那行红字警告又吃掉正文一行的高度
        //   ⇒ 正文被切的量最大 ⇒ 「正文溢出渐隐」这一条在这里最该被守住。
        { key: 'auto-longdraft', url: '/panel/?demo=1&state=auto-longdraft' },
      ];

      // ⚠ `measure()` 是同步的，而纸的栅格化是异步的 ⇒ 先量一次、全状态共用。
      //   五个状态的面板都是 380×560，同一张纸，量一次就够。
      //   ⚠ 初值带 error：万一 `measurePaper()` 没跑成，`PAPER_INK.bottomFrac`
      //   是 undefined，而裁决里有一条专门判这个 ⇒ 不会悄悄退回 512。
      let PAPER_INK = { error: '未测量（measurePaper 还没跑）', bottomFrac: 0, rightFrac: 0 };

      /**
       * **纸画出来之后**的真实边界（2026-10-18 加，票 60）。
       *
       * ## 为什么不能继续用 512 / 364
       *
       * 那两个数是 `probe-sheet.svg` 源图里**那张纸的矩形**，抄自源文件。
       * 但那张纸的**下沿是撕口**——真机实测实心只到 ≈500，差 12px
       * （`PaperPanel` 自己的注释写着「纸底破口实测 7~11px」）。
       * ⇒ 按标称值判，最后 12px 里的任何东西都判「没出纸」，
       *   而它在真机上是**画在透明区里**的。
       *
       * 这是「判据的参照物必须是产物，不是它的容器/源文件」的第三次。
       *
       * ## 怎么量
       *
       * 把同一张 SVG 画进 `<canvas>`，沿中线往下找**实心**纸色的最后一行。
       * 「实心」= 该行及其后 3 行都过半是纸色 —— 只看单行会被撕口的
       * 参差边沿骗到（实测上一版逐行判法一路数到 y=552，那是壁纸）。
       *
       * ⚠ **量不到 = 判红**，不当「没关系」。量具坏了和合规长得一模一样。
       */
      async function measurePaper() {
        const W = 380;
        const H = 560;
        const c = document.createElement('canvas');
        c.width = W;
        c.height = H;
        const g = c.getContext('2d', { willReadFrequently: true });
        const img = new Image();
        img.src = '/probe-sheet.svg';
        try {
          await img.decode();
        } catch (e) {
          return { error: 'probe-sheet.svg 载入/解码失败：' + String(e) };
        }
        g.drawImage(img, 0, 0, W, H);
        let data;
        try {
          data = g.getImageData(0, 0, W, H).data;
        } catch (e) {
          // 同源 SVG 一般不污染画布；真污染了就必须报红，不能悄悄退回标称值。
          return { error: '读不到画布像素（画布被污染）：' + String(e) };
        }
        // 纸：暖黄。R>G>B 且 R 够亮 —— 比「逐通道贴近某个 rgb」抗纹理。
        const isPaper = (i) => {
          const r = data[i];
          const gg = data[i + 1];
          const b = data[i + 2];
          const a = data[i + 3];
          return a > 128 && r > 205 && r > gg && gg > b && r - b > 25;
        };
        const x = W >> 1;
        const NEED = 3;
        const rowPaper = (y) => {
          let n = 0;
          for (let dx = -2; dx <= 2; dx += 1) {
            if (isPaper((y * W + (x + dx)) * 4)) n += 1;
          }
          return n;
        };
        const solidBottom = (() => {
          for (let y = H - 1; y >= 0; y -= 1) {
            let ok = true;
            for (let k = 0; k <= NEED; k += 1) {
              if (y + k >= H || rowPaper(y + k) < 3) {
                ok = false;
                break;
              }
            }
            if (ok) return y;
          }
          return null;
        })();
        const solidRight = (() => {
          const y = H >> 1;
          const colPaper = (xx) => {
            let n = 0;
            for (let dy = -2; dy <= 2; dy += 1) {
              if (xx >= 0 && xx < W && isPaper(((y + dy) * W + xx) * 4)) n += 1;
            }
            return n;
          };
          for (let xx = W - 1; xx >= 0; xx -= 1) {
            let ok = true;
            for (let k = 0; k <= NEED; k += 1) {
              if (xx + k >= W || colPaper(xx + k) < 3) {
                ok = false;
                break;
              }
            }
            if (ok) return xx;
          }
          return null;
        })();
        if (solidBottom === null || solidRight === null) {
          return {
            error: '画出来的纸找不到实心边（bottom=' + solidBottom + ' right=' + solidRight + '）',
          };
        }
        return {
          bottomFrac: solidBottom / H,
          rightFrac: solidRight / W,
          solidBottom,
          solidRight,
          nominalBottomFrac: 512 / 560,
          nominalRightFrac: 364 / 380,
        };
      }

      /**
       * **被裁剪之后**真的画出来的那条底边（2026-10-18 第四次订正，票 60）。
       *
       * ## 为什么 `getBoundingClientRect()` 不够
       *
       * 它给的是**布局框**的下沿，不管有没有被祖先的 `overflow` 裁掉。
       * 实测打出来的：设置屏 `.cs-hint` 的布局底是 516.2，而它所在的
       * `.cs-set` 是 `overflow-y: auto`、视口只到 512 ⇒ 布局多出来的
       * 4px 确实看不见，但**498~511 那一段是画出来的**，
       * 而实心纸底在 496 ⇒ 屏底 15px 的字画在撕口里。
       *
       * `getClientRects().length` 也判不了：被裁掉的元素照样「有 client rect」。
       *
       * ⇒ 唯一可信的量法是**沿中线用 `elementFromPoint` 逐像素打靶**：
       *   返回真元素 = 那一点真有像素。
       */
      const lowestVisible = (d, within, cx) => {
        const r = within.getBoundingClientRect();
        const x = cx === undefined ? Math.round(r.left + Math.min(r.width / 2, 60)) : cx;
        for (let y = Math.floor(r.bottom) - 1; y >= Math.ceil(r.top); y -= 1) {
          const hit = d.elementFromPoint(x, y);
          // 滚动容器自身不算「内容」——那 6px 槽里本来就什么都没有。
          if (hit && hit !== within && within.contains(hit) && !hit.classList.contains('cs-set'))
            return y;
        }
        return null;
      };

      /** 量一个 iframe 文档里的几何。 */
      function measure(doc) {
        const one = (sel) => {
          const el = doc.querySelector(sel);
          if (!el) return null;
          const r = el.getBoundingClientRect();
          return {
            top: +r.top.toFixed(1),
            bottom: +r.bottom.toFixed(1),
            h: +r.height.toFixed(1),
            w: +r.width.toFixed(1),
          };
        };
        const acts = [...doc.querySelectorAll('.cs-act')].map((el) => {
          const r = el.getBoundingClientRect();
          const cs = doc.defaultView.getComputedStyle(el);
          const inner = [...el.children].map((c) => ({
            cls: c.className.split(' ')[0],
            w: +c.getBoundingClientRect().width.toFixed(1),
            h: +c.getBoundingClientRect().height.toFixed(1),
            lines: Math.round(c.getBoundingClientRect().height / parseFloat(cs.lineHeight || 18)),
          }));
          return {
            top: +r.top.toFixed(1),
            bottom: +r.bottom.toFixed(1),
            h: +r.height.toFixed(1),
            bw: cs.borderTopWidth,
            bstyle: cs.borderTopStyle,
            pad: cs.padding,
            inner,
          };
        });
        const a = doc.querySelector('.cs-actions');
        const acs = a ? doc.defaultView.getComputedStyle(a) : null;
        const sheet = doc.querySelector('.cs-sheet');
        const scs = sheet ? doc.defaultView.getComputedStyle(sheet) : null;
        return {
          sheet: one('.cs-sheet'),
          // ⚠ **红铅笔滤镜在不在**（2026-10-16 加，2026-10-18 改判据归属）。
          //   滤镜消费者原本有两个：`PaperPanel` 的档位行 `.cs-tick`，
          //   与设置屏 `SegSlider` 药丸里那枚勾。**后者 2026-10-18 删了**
          //   （56×34 的勾盖在 12.48px 小字上，字读不出来，见 SegSlider 注释），
          //   而它删掉前那句「设置屏能画出来只因为设置屏是 PaperPanel 渲染的」
          //   是这层跨组件耦合的全部风险——现在**只剩 PaperPanel 自己**在用。
          //   ⇒ 判据保留（主面板档位行每天在画，滤镜丢了不会报错，
          //   勾会静悄悄退化成矢量），但**理由换了一个消费者，别再引旧那句**。
          pencil_defs: doc.getElementById('pencil') ? 'ok' : 'MISSING',
          // ⚠ 纸画到哪里 vs 元素框到哪（2026-10-16 加）
          //   判据：`background-size` 若是 `100% 100%`，纸就该拉满元素框；
          //   若元素框比内容还矮，那**溢出到框外的内容会落在透明区上**，
          //   在 Tauri 透明窗口里就是「一块没画」。
          sheet_bg: scs
            ? {
                image: (scs.backgroundImage || '').slice(0, 60),
                size: scs.backgroundSize,
                color: scs.backgroundColor,
                overflow: scs.overflow,
              }
            : null,
          tier: one('.cs-tier'),
          set: one('.cs-set'),
          set_overflow: (() => {
            const el = doc.querySelector('.cs-set');
            if (!el) return null;
            // ⚠ 与 `pick_clipped` 同一条病根：内容不能画到纸外。
            // ⚠⚠⚠ **2026-10-18 第四次订正（这才是真缺陷的真身）**：
            //   ① 先量容器底 ⇒ 量错了对象（容器自己不画东西）。
            //   ② 改量 `scrollTop + clientHeight - paddingBottom` ⇒ 也错了：
            //      `padding-bottom` 只在**滚到底**时起作用，而用户看到的第一屏
            //      是 `scrollTop = 0` —— 那一屏的**可视区底**（512）本身
            //      就比实心纸（496）低 16px，屏底那 16px **永远是撕口**。
            //   ③ 又量了 `.cs-hint` 的布局底（516.2）⇒ 被 `.cs-set` 裁掉，
            //      但 498~511 确实画出来了（`elementFromPoint` 命中它）。
            // ⇒ 正解：**屏底第一条真正画出来的内容在哪**。
            //   `lowestVisible` 沿中线用 `elementFromPoint` 逐像素打靶，
            //   躲不开裁剪、也躲不开「纸的边界不是矩形」。
            const sr = sheet ? sheet.getBoundingClientRect() : null;
            const pb = sr ? sr.top + sr.height * PAPER_INK.bottomFrac : null;
            const low = lowestVisible(doc, el);
            const r = el.getBoundingClientRect();
            return {
              scrollH: el.scrollHeight,
              clientH: el.clientHeight,
              gutter: el.offsetWidth - el.clientWidth,
              bottom: +r.bottom.toFixed(1),
              lowestContentY: low,
              paperBottom: pb === null ? null : +pb.toFixed(1),
              over: pb === null || low === null ? null : low - pb,
            };
          })(),
          topbar: one('.cs-topbar'),
          draft: one('.cs-draft'),
          // ⚠ 正文区自己的滚动状态（票 91，2026-10-24）。
          //   `.cs-draft` 是**滚动容器**（票 88）⇒ 长草稿会被**横切**：
          //   切一半读成「这张纸坏了」，不是「下面还有」⇒ 必须有底部渐隐。
          //   候选区早就有了这条判据（`actions_roll`），正文区不能没有。
          draft_roll: (() => {
            // ⚠ **必须用 doc**（iframe 的文档），不是顶层 document——
            //   面板是渲染在 iframe 里的（见 measure(doc)）。
            const dr = doc.querySelector('.cs-draft');
            if (!dr) return null;
            const dcs = doc.defaultView.getComputedStyle(dr);
            return {
              scrollH: dr.scrollHeight,
              clientH: dr.clientHeight,
              scrollTop: +dr.scrollTop.toFixed(1),
              below: +(dr.scrollHeight - dr.scrollTop - dr.clientHeight).toFixed(1),
              more: dr.dataset.more ?? null,
              // ⚠ `mask` 也要量：光有 `data-more` 属性不算数，
              //   得证明那条 CSS 真的落到计算样式上了（属性 → 规则的链路会断）。
              mask: (dcs.maskImage || dcs.webkitMaskImage || 'none').slice(0, 44),
            };
          })(),
          actions: one('.cs-actions'),
          // ⚠ 候选区自己的滚动状态（票 44，2026-10-16 加）。
          //   之前这里只量了 `set_overflow`（设置屏），候选区溢出**没有任何判据** ——
          //   而档位行被裁正是从这个溢出里长出来的。
          //   `mask` 也要量：光有 `data-more` 属性不算数，
          //   得证明那条 CSS 真的落到计算样式上了（属性 → 规则的链路会断）。
          actions_roll: (() => {
            if (!a) return null;
            return {
              scrollH: a.scrollHeight,
              clientH: a.clientHeight,
              scrollTop: +a.scrollTop.toFixed(1),
              below: +(a.scrollHeight - a.scrollTop - a.clientHeight).toFixed(1),
              more: a.dataset.more ?? null,
              // ⚠ 槽宽 = 滚动条实际吃掉的横向空间。原生是 15px，
              //   纸族处理过的是 6px。量到 15 就说明样式没落到这个容器上
              //   （2026-10-16：规则原先只写在 `.cs-set`，主面板漏了）。
              gutter: a.offsetWidth - a.clientWidth,
              mask: (acs.maskImage || acs.webkitMaskImage || 'none').slice(0, 44),
            };
          })(),
          // ⚠⚠ **判据的参照物必须是「纸」，不是「元素框」**（2026-10-16 改）。
          //
          //   上一版拿 `sheet.bottom - paddingBottom`（= 540）当限值，报 `clipped:false`。
          //   而 `.cs-sheet` 是 380×560 的**窗口盒**，纸只占它的上面一段：
          //   `probe-sheet.svg` 实测 —— 画布 380×560，纸 `width=348 height=512`
          //   且 `translate(16,0)`，所以**纸底在 y=512，下面 48px 是留给
          //   `sheetDrop` 落影的透明带**。
          //   ⇒ 纸底 = top + height × (512/560) = top + height × 0.914286。
          //   540 那条限值**错了 28px**，于是「档位名骑在撕口上」被判成正常。
          //
          //   ⚠ 这两个分数是从 SVG 手抄的。**重新生成 probe-sheet.svg 就必须同步改这里**，
          //   改法：`width`/`height`/`translate` 三个数除以 viewBox 的宽高。
          // ⚠⚠⚠ **2026-10-18 第三次订正：这一条量错了对象。**
          //   它量的是 `.cs-pick` 的 **border-box 底**，而 `.cs-pick`
          //   **自己不画任何东西**：没有背景、没有边框，`gap: 0`，
          //   画出来的是它的子元素（`.cs-pick-slot` 档位格 + `.cs-tick` 勾）。
          //   证据（改 `padding-bottom` 时打出来的）：把 `.cs-pick` 的
          //   `padding-bottom` 从 8 抬到 20，**底仍然是 500，一动没动**
          //   —— padding 挪的是内容，不是容器边。
          // ⇒ 改为量**真正有像素的两个东西**：
          //   ① `.cs-pick-slot` 底（档位格，有边框/底色）
          //   ② 每个 `.cs-markbox` 里 svg 的底（勾，见 `marks` 另一条）
          //   与 `set_overflow` 同一条病：**量具必须对着会画东西的那个**。
          // ⚠⚠ 连着犯两次的教训：把判据的**参照物**换成产物之后，
          //   还要重新审计每一条判据**量的是不是产物**。
          //   第一遍只换了限值、没换被测对象 ⇒ 换出一个假阳性。
          pick_clipped: (() => {
            // ⚠⚠ 两块面板的档位行**不是同一个东西**：
            //   主面板是 `.cs-pick`（`PaperPanel`），设置屏是 `.cs-tier`
            //   （`TierSwitch`）。原先这里只找 `.cs-pick`，在 `settings`
            //   状态永远 null ⇒ 「量不到 = 红」把那格永久判红，
            //   而它其实是**选择器写错了**，不是那里真的出纸。
            const pk = doc.querySelector('.cs-pick');
            const tier = pk ? null : doc.querySelector('.cs-tier');
            if (!pk && !tier) return null;
            const host = pk || tier;
            const where = pk ? '档位行内最低可见像素' : '档位组内最低可见像素';
            if (!host) return null;
            const sr = sheet.getBoundingClientRect();
            const limit = sr.top + sr.height * PAPER_INK.bottomFrac;
            const slotBottom = lowestVisible(doc, host);
            return {
              // 布局框底只作参考：它会被祖先 `overflow` 裁掉，也可能是空容器。
              bottom: +host.getBoundingClientRect().bottom.toFixed(1),
              slotBottom: slotBottom,
              where,
              paperBottom: +limit.toFixed(1),
              paperNominal: +(sr.top + sr.height * (512 / 560)).toFixed(1),
              over: slotBottom === null ? null : slotBottom - limit,
              clipped: slotBottom === null ? false : slotBottom > limit + 0.5,
              // 纸的右沿：档位格也不该横向出纸
              right: +host.getBoundingClientRect().right.toFixed(1),
              paperRight: +(sr.left + sr.width * PAPER_INK.rightFrac).toFixed(1),
            };
          })(),
          // ⚠ 红铅笔勾的真实位置（2026-10-16 加）。
          //   `.cs-pick` 那段注释里「勾的底边比槽底低 10px」是推导值，
          //   推导的前提（纸底 = 560）已经错了 ⇒ 位置必须量，不能推。
          marks: [...doc.querySelectorAll('.cs-pick .cs-markbox')].map((el) => {
            const r = el.getBoundingClientRect();
            const svg = el.querySelector('svg');
            const sr = svg ? svg.getBoundingClientRect() : null;
            return {
              box: [+r.top.toFixed(1), +r.bottom.toFixed(1)],
              svg: sr ? [+sr.top.toFixed(1), +sr.bottom.toFixed(1)] : null,
              view: svg ? svg.getAttribute('viewBox') : null,
            };
          }),
          warn: one('.cs-act-warn'),
          note: one('.cs-act-note'),
          picks: [...doc.querySelectorAll('.cs-pick')].map((el) => {
            const r = el.getBoundingClientRect();
            return {
              top: +r.top.toFixed(1),
              bottom: +r.bottom.toFixed(1),
              h: +r.height.toFixed(1),
            };
          }),
          slots: [...doc.querySelectorAll('.cs-pick-slot')].map((el) => {
            const r = el.getBoundingClientRect();
            return {
              top: +r.top.toFixed(1),
              bottom: +r.bottom.toFixed(1),
              h: +r.height.toFixed(1),
              w: +r.width.toFixed(1),
            };
          }),
          gap: acs ? acs.rowGap : null,
          apad: acs ? `${acs.paddingTop}/${acs.paddingBottom}` : null,
          acts,
        };
      }

      const out = document.getElementById('out');
      const verdict = document.getElementById('verdict');
      const host = document.getElementById('frames');
      const results = {};
      let done = 0;

      /**
       * 判据汇总：**只输出通过/失败**，不输出读数（2026-10-16 加）。
       *
       * ## 为什么要有这一层
       * 读数块已经有一万多字，而复核时真正要回答的问题只有六个「有没有破」。
       * 把判据写成代码还有一个更重要的作用：**它必须能因为判据本身写错而失败**。
       * `pick_clipped` 第一版拿「元素底 540」当限值，报了 `clipped:false`，
       * 而那张图上档位名明摆着骑在纸外 —— 判据自己骗了自己。
       * 写成 `PAPER_BOTTOM = 512`（来自 `probe-sheet.svg` 的实测）之后，
       * 它才对上了出图。
       *
       * ⚠ 每条判据后面都写了**判据本身的依据**。
       *   依据变了必须改这里，不要只改读数块。
       */
      function judge(r) {
        const lines = [];
        const add = (ok, name, detail) =>
          lines.push(`${ok ? 'PASS' : 'FAIL'}  ${name}${detail ? '  — ' + detail : ''}`);

        for (const [k, s] of Object.entries(r)) {
          if (s.error) {
            add(false, `${k}: 载入`, s.error);
            continue;
          }
          // ⛔ **纸的边界量到了没有**（2026-10-18，票 60）。
          //   这一格是**整台架的地基**：纸底取的是 SVG 的标称矩形，
          //   而真纸上那条边被撕口吃了 ~12px ⇒ 标称判据把出纸当成没出纸。
          //   ⚠ 量不到 = 红。「拿不到量具」与「量过了没问题」在输出上同形。
          add(
            !PAPER_INK.error,
            '纸的实心边界已量到',
            PAPER_INK.error
              ? PAPER_INK.error
              : `实心底 ${PAPER_INK.solidBottom} / 标称 ${(PAPER_INK.nominalBottomFrac * 560).toFixed(0)}（Δ${(560 * (PAPER_INK.nominalBottomFrac - PAPER_INK.bottomFrac)).toFixed(1)}px）`,
          );
          // ① 档位格底必须在纸内。依据：**画出来的那条纸底**，不是 512。
          // ⚠⚠ `pick_clipped === null` 时**原来直接跳过** ——
          //   而真机那次恰恰是空态（`.cs-pick` 不在），于是这一条
          //   **一次都没在出问题的那个状态上跑过**。
          //   ⇒ 现在「没量到」自己报红，不再与「量到没超」同形。
          if (s.pick_clipped) {
            add(
              !s.pick_clipped.clipped && s.pick_clipped.slotBottom !== null,
              `${k}: 档位格不出纸`,
              `${s.pick_clipped.slotBottom} vs 纸底 ${s.pick_clipped.paperBottom}（${s.pick_clipped.where}；布局框底 ${s.pick_clipped.bottom} 不画东西也不参与判红；标称会是 ${s.pick_clipped.paperNominal}）`,
            );
            // ② 红铅笔勾的尾巴也必须在纸内 —— 档位格在纸上不代表勾在纸上。
            // ⚠ 同一个病：原来写死 `vs 512`，而勾**本来就溢出自己的取景框**
            //   （设计如此，PaperPanel 里写着），所以它的尾巴必须拿**实心纸底**比。
            const mk = (s.marks || [])[0];
            const inkBottom = s.pick_clipped.paperBottom;
            if (mk && mk.svg) {
              add(mk.svg[1] <= inkBottom, `${k}: 红勾不出纸`, `勾底 ${mk.svg[1]} vs ${inkBottom}`);
            }
          } else {
            add(
              false,
              `${k}: 档位格不出纸`,
              '这一状态里量不到 `.cs-pick`（空态？）—— 没量到不等于没超',
            );
          }
          // ③ 设置屏这一列也不能画到纸外（与 ① 同一个病根、同一个新参照）。
          //   量的是**屏底第一条真正画出来的内容**（见 `lowestVisible`）。
          if (s.set_overflow) {
            add(
              s.set_overflow.lowestContentY !== null &&
                s.set_overflow.paperBottom !== null &&
                s.set_overflow.lowestContentY <= s.set_overflow.paperBottom,
              `${k}: 设置列不出纸`,
              `屏底内容 y=${s.set_overflow.lowestContentY} vs 纸底 ${s.set_overflow.paperBottom}（可视区底 ${s.set_overflow.bottom}）`,
            );
          }
          // ④ 滚动条被接管。依据：原生 15px，纸族 6px。
          // ⚠⚠ `.cs-set` 的槽宽是 2026-10-16 票 44 **主动归零**的
          //   （见 `PaperPanel` 的「6 → 10 → 6 → 0」），所以这一格
          //   **只对 `.cs-actions` 有意义**；对 `.cs-set` 判 6 是在判一个
          //   已经被推翻的设计。真实 Windows WebView2 上是经典滚动条，
          //   **无头 Chrome 是 overlay、不占布局** ⇒ 这一格在无头环境里
          //   稳定误报。⇒ 改成：只判「不是 15」（漏了接管），不判「必须是 6」。
          if (s.actions_roll) {
            add(
              s.actions_roll.gutter !== 15,
              `${k}: 候选区滚动条`,
              `槽宽 ${s.actions_roll.gutter}（15 = 原生漏接管；6 是设计值，overlay 环境量到 0 不算漏）`,
            );
          }
          if (s.set_overflow) {
            add(
              s.set_overflow.gutter !== 15,
              `${k}: 设置区滚动条`,
              `槽宽 ${s.set_overflow.gutter}（同上；票 44 已把这一格归零）`,
            );
          }
          // ⑤ 溢出时底部渐隐必须真的落到计算样式上（属性 → CSS 的链路会断）。
          if (s.actions_roll) {
            add(
              s.actions_roll.below <= 1 ||
                String(s.actions_roll.mask).startsWith('linear-gradient'),
              `${k}: 溢出渐隐`,
              `below=${s.actions_roll.below} mask=${s.actions_roll.mask.slice(0, 18)}`,
            );
          }
          // ⑥ 正文区溢出时底部渐隐必须真的落到计算样式上（票 91，2026-10-24）。
          //   与 ⑤ **同一套形状**：候选区有，正文区也必须有。
          if (s.draft_roll) {
            add(
              s.draft_roll.below <= 1 || String(s.draft_roll.mask).startsWith('linear-gradient'),
              `${k}: 正文溢出渐隐`,
              `below=${s.draft_roll.below} mask=${s.draft_roll.mask.slice(0, 18)}`,
            );
          }
          // ⑦ 红铅笔滤镜在（主面板档位行的勾跨组件引用它，断了不会报错）。
          add(s.pencil_defs === 'ok', `${k}: #pencil 滤镜`, s.pencil_defs);
        }
        const failed = lines.filter((l) => l.startsWith('FAIL')).length;
        lines.unshift(
          failed === 0 ? `ALL GREEN（${lines.length} 条判据）` : `FAILED ${failed}/${lines.length}`,
        );
        // ⚠⚠ 2026-10-18：这几格红**不是台架坏了**，是判据终于对准了产物。
        //   纸底的参照从 SVG 的标称矩形（512）换成**画出来的那条边**（实测 496，
        //   Δ16px）之后，「档位格不出纸 / 红勾不出纸 / 设置列不出纸」三格由绿转红
        //   —— 它们在标称参照下量到的「余 12~16px」全在撕口里，真机上画不出来。
        //   真机实拍证据见 `.scratch/…/60-tier-row-runs-off-paper-…md`。
        if (failed > 0) {
          lines.splice(
            1,
            0,
            '⚠ 下面这些红是真的：判据的参照物已从「SVG 标称矩形 512」换成',
            '  「画出来的实心纸底 496」。修复方向见票 60 的「三选一」，本台架不负责改版式。',
          );
        }
        return lines.join('\n');
      }

      /**
       * ⚠ **轮询等元素出现，不能用固定帧数**（第一版踩到）。
       *   第一版是 `load` 事件 + 两帧 rAF，量出来 `.cs-sheet` 等**全是 null**、
       *   `acts: []` —— 而同一时刻的截图里面板明明渲染好了。
       *   原因：iframe 的 `load` 在 SvelteKit 路由与字体度量之前就触发，
       *   两帧 rAF 只够跑两遍布局，跑不完路由解析。
       *   ⇒ 症状极具误导性：**返回的是一个合法的、全 null 的对象**，
       *   不报错、JSON 完整，于是很容易被当成「面板里没有这些元素」
       *   而去查产品代码 —— 而 product 代码完全正常。
       */
      function waitFor(fn, ms = 8000) {
        return new Promise((res) => {
          const t0 = performance.now();
          (function tick() {
            let v;
            try {
              v = fn();
            } catch {
              v = null;
            }
            if (v) return res(v);
            if (performance.now() - t0 > ms) return res(null);
            requestAnimationFrame(tick);
          })();
        });
      }

      // ⚠ 先量纸、再量面板。`measure()` 是同步的，取不到纸的边界就只能
      //   退回标称值 —— 那正是票 60 里判据失灵的原因，所以宁可整台架判红。
      // ⚠⚠ 这里**必须**包在 async IIFE 里：本文件是普通 `<script>`（不是
      //   `type="module"`），顶层 `await` 会直接抛
      //   「await is only valid in async functions」——
      //   而那句话出现在控制台里、`document.title` 停在 `budget`，
      //   **台架看起来只是「还没跑完」，不是「坏了」**。
      (async () => {
        PAPER_INK = await measurePaper();

        for (const st of STATES) {
          const f = document.createElement('iframe');
          f.src = st.url;
          host.appendChild(f);
          (async () => {
            await waitFor(
              () =>
                f.contentDocument &&
                (f.contentDocument.querySelector('.cs-act') ||
                  f.contentDocument.querySelector('.cs-set')),
            );
            // 再等两帧，让字体度量与 GSAP 补间落定
            await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
            try {
              results[st.key] = measure(f.contentDocument);
            } catch (e) {
              results[st.key] = { error: String(e) };
            }
            if (++done === STATES.length) {
              out.textContent = JSON.stringify({ paper_ink: PAPER_INK, states: results }, null, 1);
              verdict.textContent = judge(results);
              document.title = 'READY';
            }
          })();
        }
      })();
    </script>
  </body>
</html>
